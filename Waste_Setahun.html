  gl.forEach(x=>{let seen=0,ab=0;mon.forEach(r=>{const v=r.get(x.ti);if(v&&v.idx!=null){seen++;if(v.idx>=1.5)ab++}});x.ms=seen;x.ma=ab;x.kons=seen>=2&&ab>=Math.max(2,Math.ceil(seen/2))});
  gl.sort((a,b)=>b.idx-a.idx);
  const nHi=gl.filter(x=>x.idx>=1.5).length,nKons=gl.filter(x=>x.kons).length;
  // gerai tanpa catatan waste (ada penjualan/pakai tapi tidak ada baris waste sama sekali di rentang)
  const withU=new Set(),withW=new Set();
  for(const r of D.p)if(r[0]>=S.b0&&r[0]<=S.b1&&GER[r[1]]&&okT(r[1]))withU.add(r[1]);
  for(const r of D.w)if(r[0]>=S.b0&&r[0]<=S.b1&&GER[r[1]]&&okT(r[1]))withW.add(r[1]);
  const noRec=[...withU].filter(t=>!withW.has(t)).length;
  // kacab
  const kk=new Map();gl.forEach(x=>{const k=x.t.k||'(tanpa kacab)';(kk.get(k)||kk.set(k,[]).get(k)).push(x.idx)});
  const kl=[...kk].filter(([,a])=>a.length>=3).map(([k,a])=>[k,med(a),a.length]).sort((a,b)=>b[1]-a[1]);
  // KPI
  const upN=rows.filter(x=>x.chg!=null&&x.chg>0.1).length,dnN=rows.filter(x=>x.chg!=null&&x.chg<-0.1).length;
  const kpis=`<div class="kpis">
   <div class="kpi"><b>${rows.length}</b><span>Barang ber-waste</span></div>
   <div class="kpi"><b>${pw?upN+' naik · '+dnN+' turun':'–'}</b><span>% waste vs periode sebelumnya (selisih >10%)</span></div>
   <div class="kpi"><b>${gl.length?nHi+' dari '+gl.length:'–'}</b><span>Gerai di atas 1,5× rata-rata jaringan</span></div>
   <div class="kpi"><b>${noRec}</b><span>Gerai ada penjualan tapi tanpa catatan waste</span></div></div>`;
  // insight
  const L=[];
  if(cand.length){const t=[...cand].sort((a,b)=>b.r-a.r).slice(0,3);L.push(`% waste tertinggi: ${t.map(x=>`<b>${esc(x.nm)}</b> (${pc(x.r)})`).join(', ')}.`)}
  if(pw){const up=rows.filter(x=>x.chg!=null&&x.old>0&&x.e.wn>0&&x.e.tk.size>=nTk).sort((a,b)=>b.chg-a.chg).filter(x=>x.chg>0.1).slice(0,2);
    const dn=rows.filter(x=>x.chg!=null&&x.old>0).sort((a,b)=>a.chg-b.chg).filter(x=>x.chg<-0.1).slice(0,1);
    if(up.length)L.push(`Naik paling tajam dibanding ${MO[pw[0]]}${pw[0]!==pw[1]?' s/d '+MO[pw[1]]:''}: ${up.map(x=>`<b>${esc(x.nm)}</b> (${pc(x.old)} → ${pc(x.r)})`).join(', ')}.`);
    if(dn.length)L.push(`Membaik: <b>${esc(dn[0].nm)}</b> turun dari ${pc(dn[0].old)} ke ${pc(dn[0].r)}.`);
    if(!up.length&&!dn.length)L.push('% waste per barang relatif stabil dibanding periode sebelumnya.')}
  else L.push('Belum ada periode pembanding (rentang bulan dimulai dari data pertama).');
  if(gl.length){L.push(`${nHi} dari ${gl.length} gerai punya waste di atas 1,5× rata-rata jaringan${gl[0].idx>=1.5?'; tertinggi '+gl.slice(0,3).map(x=>`<b>${esc(x.t.n)}</b> (${fmt1(x.idx)}×)`).join(', '):''}.`);
    if(nKons)L.push(`${nKons} gerai konsisten di atas rata-rata (≥ separuh bulan yang tercatat); ini lebih layak dicek daripada lonjakan satu bulan.`)}
  if(kl.length>1)L.push(`Kacab dengan indeks gerai tertinggi: <b>${esc(kl[0][0])}</b> (median ${fmt1(kl[0][1])}×); terendah <b>${esc(kl[kl.length-1][0])}</b> (${fmt1(kl[kl.length-1][1])}×).`);
  if(noRec)L.push(`${noRec} gerai punya penjualan tapi tidak ada catatan waste: kemungkinan belum dicatat, bukan nol waste.`);
  const nFl=rows.filter(x=>x.fl).length;if(nFl)L.push(`${nFl} barang (${rows.filter(x=>x.fl).slice(0,4).map(x=>`<b>${esc(x.nm)}</b>`).join(', ')}${nFl>4?', ...':''}) ditandai <b>n/a</b>: dipakai banyak menu sehingga pemakaiannya tidak lengkap di resep dan % waste-nya semu. Angka waste (qty) tetap tampil; % tidak dihitung.`);
  const sum=`<div class="sum"><b class="h">Insight otomatis</b><ul>${L.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  // grafik tren
  let chart='';
  if(nb>=2&&cand.length){const top=[...cand].sort((a,b)=>b.r-a.r).slice(0,5);const labs=[];for(let m=S.b0;m<=S.b1;m++)labs.push(MO[m].slice(2));
    const ser=top.map(x=>({n:x.nm,v:labs.map((_,i)=>{const m=S.b0+i;return rateOf(x.e.wnm[m],x.e.um[m])})}));
    chart=`<div class="card"><h2>Tren % waste per bulan<small>5 barang dengan % tertinggi</small></h2>${lineSvg(labs,ser,true)}<p class="note">% waste = waste ÷ (pemakaian + waste). Dipakai persentase karena satuan antar barang berbeda. Klik barang di tabel bawah untuk grafik satu barang.</p></div>`}
  // gerai
  const lim=S.nrow;
  const gtab=gl.length?`<div class="card"><h2>Gerai yang perlu dicek<small>indeks waste dibanding rata-rata jaringan</small></h2>
   <div class="filters" style="padding:0 0 8px;border:0;max-width:none"><label>Tampilkan<select id="fn"><option value="15">15 teratas</option><option value="30">30 teratas</option><option value="9999">Semua</option></select></label></div>
   <div class="tw"><table><tr><th>Gerai</th><th style="text-align:left">Kacab</th><th>Indeks</th><th>Barang di atas 1,5×</th><th>Bulan di atas</th><th style="text-align:left">Barang tertinggi</th><th>Status</th></tr>
   ${gl.slice(0,lim).map(x=>`<tr><td>${esc(x.t.n)}</td><td style="text-align:left">${esc(x.t.k||'–')}</td><td class="${x.idx>=1.5?'hi':x.idx<0.5?'lo':''}"><b>${fmt1(x.idx)}×</b></td><td>${x.red} dari ${x.n}</td><td>${x.ms>=2?x.ma+' dari '+x.ms:'–'}</td><td style="text-align:left">${x.worst?esc(D.barang[x.worst[0]])+' ('+fmt1(x.worst[1])+'×)':'–'}</td><td>${x.kons?'<span class="badge b-bad">konsisten</span>':x.idx>=1.5?'<span class="badge b-w">di atas</span>':'<span class="badge b-ok">wajar</span>'}</td></tr>`).join('')}</table></div>
   <p class="note">Indeks 1,0× = sama dengan rata-rata jaringan, 2,0× = dua kali lipat. Dihitung per barang (% waste gerai ÷ % waste jaringan) lalu diambil nilai tengahnya, jadi satuan barang tidak tercampur. Acuannya selalu seluruh jaringan walau filter kacab/toko dipakai. "Konsisten" = di atas 1,5× pada minimal separuh bulan yang tercatat (min. 2 bulan). Hanya gerai yang mencatat waste per gerai (export per gerai); indeks butuh minimal 3 barang.</p></div>`:'';
  // matriks
  const body=rows.map(x=>{const a=x.e;let cells='';for(let b=S.b0;b<=S.b1;b++)cells+=`<td style="${heat(a.wm[b],x.mx)}">${a.wm[b]?fmt1(a.wm[b]):''}</td>`;
    const tg=(x.hi?'hi ':'')+(x.chg!=null&&x.chg>0.1?'up ':'')+(x.chg!=null&&x.chg<-0.1?'dn ':'');
    return `<tr class="br" data-b="${x.bi}" data-t="${tg}" data-n="${esc(x.nm.toLowerCase())}"><td>${esc(x.nm)}</td>${cells}<td><b>${fmt1(a.tot)}</b></td><td>${fmt1(a.tot/nb)}</td><td>${a.tk.size}</td><td class="${x.hi?'hi':''}">${x.fl?NA:(x.r==null?'–':pc(x.r))}</td><td>${wTrend(x.r,x.old)}</td></tr>`}).join('');
  let hd='';for(let b=S.b0;b<=S.b1;b++)hd+=`<th>${MO[b].slice(2)}</th>`;
  const mxc=`<div class="card"><h2>Waste per barang per bulan</h2>
   <div class="filters" style="padding:0 0 8px;border:0;max-width:none"><label>Cari barang<input id="mq" type="search" placeholder="ketik nama barang" style="background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit"></label>
   <div class="chips" id="mf">${[['','Semua'],['hi','% waste tinggi'],['up','Naik'],['dn','Turun']].map(([k,n])=>`<button type="button" data-k="${k}" class="${S.mf===k?'on':''}">${n}</button>`).join('')}</div><span class="note" id="mc"></span></div>
   <div class="tw"><table class="mx"><tr><th>Barang</th>${hd}<th>Total</th><th>Rata² / bulan</th><th>Gerai</th><th>% dari pakai</th><th>Tren %</th></tr>${body}</table></div>
   <p class="note">Klik barang untuk rincian. Satuan tiap barang beda (pcs, gram, dll), jadi angka antar barang tidak dijumlahkan. "% dari pakai" = waste ÷ (pemakaian dari penjualan × resep + waste); waste dari file gabungan beberapa toko tidak ikut persentase. Merah = ≥ 1,5× nilai tengah % semua barang. Tren % = perubahan % waste dibanding ${pw?MO[pw[0]]+(pw[0]!==pw[1]?' s/d '+MO[pw[1]]:''):'periode sebelumnya (belum tersedia)'}; naik = merah, turun = hijau.</p></div>`;
  return kpis+sum+chart+gtab+mxc;
}
function applyMF(){
  const q=($('#mq')||{value:''}).value.trim().toLowerCase();let n=0,t=0;
  document.querySelectorAll('tr.br').forEach(tr=>{t++;const ok=(!q||tr.dataset.n.includes(q))&&(!S.mf||(' '+tr.dataset.t).includes(' '+S.mf+' '));tr.style.display=ok?'':'none';if(ok)n++});
  const c=$('#mc');if(c)c.textContent=`${n} dari ${t} barang`;
  document.querySelectorAll('#mf button').forEach(b=>b.classList.toggle('on',b.dataset.k===S.mf));
}

function trendCard(b,wmn,pm){
  const labs=[],f=[],n=[];const all=new Array(M).fill(0),allu=new Array(M).fill(0);
  for(const r of D.w)if(r[2]===b&&GER[r[1]])all[r[0]]+=r[3];
  for(const r of D.p)if(r[2]===b)allu[r[0]]+=r[3];
  for(let m=S.b0;m<=S.b1;m++){labs.push(MO[m].slice(2));f.push(rateOf(wmn[m],pm[m]));n.push(rateOf(all[m],allu[m]))}
  if(labs.length<2)return '';
  const filt=S.wil||S.kac||S.toko!=='';
  const ser=[{n:filt?'Filter terpilih':'Semua gerai',v:f}];if(filt)ser.push({n:'Seluruh jaringan',v:n,dash:1,c:'#7A8699'});
  return `<div class="card"><h2>Tren % waste per bulan<small>${esc(D.barang[b])}</small></h2>${lineSvg(labs,ser,true)}<p class="note">% waste = waste ÷ (pemakaian + waste).${filt?' Garis putus-putus = seluruh jaringan sebagai pembanding.':''}</p></div>`}
function detail(W,P){
  const b=+S.br;const nb=S.b1-S.b0+1;const w=W.filter(r=>r[2]===b),p=P.filter(r=>r[2]===b);
  const wm=new Array(M).fill(0),pm=new Array(M).fill(0),wmn=new Array(M).fill(0);
  w.forEach(r=>{wm[r[0]]+=r[3];if(!D.toko[r[1]].g)wmn[r[0]]+=r[3]});p.forEach(r=>pm[r[0]]+=r[3]);
  const tot=wm.reduce((a,v)=>a+v,0),totn=wmn.reduce((a,v)=>a+v,0),pu=pm.reduce((a,v)=>a+v,0);
  const fl=FLAG.has(b),rate=!fl&&pu+totn>0?totn/(pu+totn):null;
  const tk=new Set(w.map(r=>r[1]));
  // bar per bulan
  const mx=Math.max(...wm.slice(S.b0,S.b1+1))||1;
  let bars='<div class="jam">';for(let i=S.b0;i<=S.b1;i++){const pr=!fl&&pm[i]+wmn[i]>0?wmn[i]/(pm[i]+wmn[i]):null;bars+=`<div title="${MO[i]} · waste ${fmt1(wm[i])}${pr==null?'':' · '+pc(pr)+' dari pakai'}"><span>${wm[i]?fmt1(wm[i]):''}</span><i style="height:${wm[i]/mx*115}px"></i><span>${MO[i].slice(2)}</span><span>${pr==null?'':pc(pr)}</span></div>`}bars+='</div>';
  // per toko / per kacab
  const tw=new Map(),tp=new Map(),tm=new Map();
  w.forEach(r=>{tw.set(r[1],(tw.get(r[1])||0)+r[3]);(tm.get(r[1])||tm.set(r[1],new Set()).get(r[1])).add(r[0])});
  p.forEach(r=>tp.set(r[1],(tp.get(r[1])||0)+r[3]));
  const rows=[...tw].map(([ti,q])=>{const t=D.toko[ti];const u=tp.get(ti)||0;const ok=!fl&&!t.g&&u+q>0;return {ti,n:t.n,k:t.k||'(tanpa kacab)',q,u,r:ok?q/(u+q):null,nm:tm.get(ti).size}});
  const kk=new Map();rows.forEach(x=>{let a=kk.get(x.k);if(!a){a={q:0,u:0,n:0,qn:0};kk.set(x.k,a)}a.q+=x.q;a.n++;if(x.r!=null){a.qn+=x.q;a.u+=x.u}});
  const krows=[...kk].map(([k,a])=>[k,a.q,a.n,a.u+a.qn>0?a.qn/(a.u+a.qn):null]).sort((x,y)=>y[1]-x[1]);
  const ttl=rows.sort((x,y)=>y.q-x.q);const lim=40;
  const cls=r=>r!=null&&rate!=null&&r>rate*1.5?'hi':(r!=null&&rate!=null&&r<rate*0.5?'lo':'');
  const nbl=S.b1-S.b0+1;
  return `<div class="kpis">
   <div class="kpi"><b>${fmt1(tot)}</b><span>Total waste ${esc(D.barang[b])}</span></div>
   <div class="kpi"><b>${fl?NA:(rate==null?'–':pc(rate))}</b><span>% dari pakai</span></div>
   <div class="kpi"><b>${fmt1(tot/nbl)}</b><span>Rata² waste / bulan</span></div>
   <div class="kpi"><b>${tk.size}</b><span>Gerai yang mencatat waste</span></div></div>
  <div class="card"><h2>Waste ${esc(D.barang[b])} per bulan</h2>${bars}<p class="note">Angka di atas batang = qty waste, di bawah = % dari pakai.</p></div>
  ${fl?'<div class="card"><p class="note"><b>% waste tidak ditampilkan</b> untuk barang ini: pemakaiannya belum tercatat lengkap (barang dipakai banyak menu, sedangkan resep hanya mencakup sebagian), jadi hasilnya hampir 100% dan menyesatkan. Qty waste tetap benar. Lengkapi pemakaian lewat export stok POS per gerai, atau tambah resep menu terkait di INPUT_MANUAL.xlsx sheet Resep.</p></div>':trendCard(b,wmn,pm)}
  <div class="card"><h2>Per kacab</h2><div class="tw"><table><tr><th>Kacab</th><th>Waste</th><th>Gerai</th><th>% dari pakai</th></tr>${krows.map(([k,q,n,r])=>`<tr><td>${esc(k)}</td><td>${fmt1(q)}</td><td>${n}</td><td class="${cls(r)}">${r==null?'–':pc(r)}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>Per gerai${ttl.length>lim?` (${lim} teratas dari ${ttl.length})`:''}</h2><div class="tw"><table><tr><th>Gerai</th><th>Kacab</th><th>Waste</th><th>Pakai</th><th>% dari pakai</th><th>Bulan ada waste</th></tr>${ttl.slice(0,lim).map(x=>`<tr><td>${esc(x.n)}</td><td style="text-align:left">${esc(x.k)}</td><td>${fmt1(x.q)}</td><td>${fmt1(x.u)}</td><td class="${cls(x.r)}">${x.r==null?'–':pc(x.r)}</td><td>${x.nm} dari ${nbl}</td></tr>`).join('')}</table></div>
  <p class="note">Merah = persentase waste lebih dari 1,5× rata-rata semua gerai terpilih; hijau = kurang dari setengahnya. Gerai dengan waste sedikit tapi pakai besar bisa saja bagus; gerai tanpa catatan waste tidak tampil di sini.</p></div>
  <div class="card"><h2>Rincian per bulan</h2><div class="tw"><table><tr><th>Bulan</th><th>Waste</th><th>Pakai</th><th>% dari pakai</th></tr>${MO.map((m,i)=>i<S.b0||i>S.b1?'':`<tr><td>${m}</td><td>${wm[i]?fmt1(wm[i]):'–'}</td><td>${fmt1(pm[i])}</td><td>${fl?'n/a':(pm[i]+wmn[i]>0?pc(wmn[i]/(pm[i]+wmn[i])):'–')}</td></tr>`).join('')}</table></div></div>`;
}

function render(){try{render0()}finally{postH()}}
function render0(){
  if(S.b0>S.b1||S.b0>=M||S.b1<0){$('#main').innerHTML='<div class="card"><p class="note">Tidak ada data pada rentang bulan ini.</p></div>';return}
  const {W,P}=sel();
  if(!D.w.length){$('#main').innerHTML='<div class="card"><p class="note">Belum ada data waste. Waste terbaca dari sheet stok di file POS (export per gerai per hari supaya terpisah per gerai) atau dari sheet Waste di INPUT_MANUAL.xlsx.</p></div>';return}
  if(!W.length){$('#main').innerHTML='<div class="card"><p class="note">Tidak ada waste untuk filter ini.</p></div>';return}
  $('#main').innerHTML=S.br===''?overview():detail(W,P);
  const fn=$('#fn');if(fn){fn.value=String(S.nrow);fn.onchange=e=>{S.nrow=+e.target.value;render()}}
  const mq=$('#mq');if(mq)mq.oninput=applyMF;const mf=$('#mf');if(mf)mf.onclick=e=>{const b=e.target.closest('button');if(!b)return;S.mf=b.dataset.k;applyMF()};
  applyMF();
  document.querySelectorAll('tr.br').forEach(tr=>tr.onclick=()=>{S.br=tr.dataset.b;$('#fr').value=S.br;render();window.scrollTo(0,0)});
}
function fillToko(){
  const l=D.toko.map((t,i)=>[t,i]).filter(([t])=>!t.g&&t.w&&(!S.wil||t.w===S.wil)&&(!S.kac||t.k===S.kac));
  $('#ft').innerHTML='<option value="">Semua toko</option>'+l.map(([t,i])=>`<option value="${i}">${esc(t.n)}</option>`).join('');$('#ft').value=S.toko;
}
function fillBarang(){
  const tot=new Map();D.w.forEach(r=>{if(inM(r)&&okT(r[1]))tot.set(r[2],(tot.get(r[2])||0)+r[3])});
  const l=[...tot].sort((a,b)=>b[1]-a[1]);
  $('#fr').innerHTML='<option value="">Semua barang (ringkasan)</option>'+l.map(([i])=>`<option value="${i}">${esc(D.barang[i])}</option>`).join('');
  if(S.br!==''&&!tot.has(+S.br))S.br='';
  $('#fr').value=S.br;
}
function setup(){
  $('#sub').textContent=`${MO[0]} s/d ${MO[M-1]} · dibuat ${D.meta.generated}`;
  const mo=MO.map((m,i)=>`<option value="${i}">${m}</option>`).join('');$('#fb0').innerHTML=mo;$('#fb1').innerHTML=mo;$('#fb0').value=S.b0;$('#fb1').value=S.b1;
  $('#fw').innerHTML='<option value="">Semua wilayah</option>'+wilayahs.map(w=>`<option>${esc(w)}</option>`).join('');
  $('#fk').innerHTML='<option value="">Semua kacab</option>'+kacabs.map(k=>`<option>${esc(k)}</option>`).join('');
  fillToko();fillBarang();
  const re=()=>{fillBarang();render()};
  $('#fb0').onchange=e=>{S.b0=+e.target.value;if(S.b0>S.b1){S.b1=S.b0;$('#fb1').value=S.b1}re()};
  $('#fb1').onchange=e=>{S.b1=+e.target.value;if(S.b1<S.b0){S.b0=S.b1;$('#fb0').value=S.b0}re()};
  $('#fw').onchange=e=>{S.wil=e.target.value;S.toko='';fillToko();re()};
  $('#fk').onchange=e=>{S.kac=e.target.value;S.toko='';fillToko();re()};
  $('#ft').onchange=e=>{S.toko=e.target.value;re()};

<script>
/* Urut kolom angka: klik judul kolom (tinggi->rendah, rendah->tinggi, urutan awal). Berlaku untuk semua tabel. */
(function(){
  const st=document.createElement('style');
  st.textContent='th.so{cursor:pointer;user-select:none;white-space:nowrap}th.so:hover{color:var(--act,#c2410c)}th.so::after{content:"\\2195";opacity:.35;margin-left:5px;font-size:11px}th.so.d::after{content:"\\25BC";opacity:1;color:var(--act,#c2410c)}th.so.a::after{content:"\\25B2";opacity:1;color:var(--act,#c2410c)}';
  document.head.appendChild(st);
  const MEM={};
  function num(t){
    t=(t||'').replace(/−/g,'-').trim();if(!t)return null;
    const m=t.match(/^(?:Rp\s*|[^\d\-+A-Za-z]{0,3}\s*)?([+\-]?\d[\d.,]*)(.*)$/);if(!m)return null;
    if(/^\d{4}-\d{2}/.test(t)||m[2].length>14)return null;
    let s=m[1].replace(/^\+/,''),neg=s[0]==='-';s=s.replace(/^-/,'');
    if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
    let v=parseFloat(s);if(isNaN(v))return null;if(neg)v=-v;
    const r=m[2];
    if(/^\s*M\b/.test(r))v*=1e9;else if(/^\s*jt\b/.test(r))v*=1e6;else if(/^Rp/.test(t))v*=1;
    return v;
  }
  function key(i){let t='';try{t=(typeof S!=='undefined'&&S.tab)||''}catch(e){}return t+'#'+i}
  function apply(tb,col,dir){
    const rows=tb._body,cn=tb._n;
    const ok=rows.filter(r=>r.cells.length===cn);
    const bad=rows.filter(r=>r.cells.length!==cn);
    let ord;
    if(!dir)ord=ok.slice().sort((a,b)=>a._o-b._o);
    else{
      const val=new Map(ok.map(r=>[r,num(r.cells[col].innerText)]));
      ord=ok.slice().sort((a,b)=>{const x=val.get(a),y=val.get(b);
        if(x==null&&y==null)return a._o-b._o;if(x==null)return 1;if(y==null)return -1;
        return (dir==='d'?y-x:x-y)||(a._o-b._o)});
    }
    const par=ok.length?ok[0].parentNode:null;if(!par)return;
    ord.concat(bad).forEach(r=>par.appendChild(r));
    tb._hd.forEach((th,i)=>{th.classList.remove('d','a');if(i===col&&dir)th.classList.add(dir)});
  }
  function init(){
    [...document.querySelectorAll('table')].forEach((tb,ti)=>{
      if(tb.dataset.so)return;tb.dataset.so='1';
      const all=[...tb.rows];let h=0;while(h<all.length&&[...all[h].cells].every(c=>c.tagName==='TH'))h++;
      if(!h)return;const hr=all[h-1],body=all.slice(h);
      if(body.length<2||body.some(r=>[...r.cells].some(c=>c.tagName==='TH')))return;
      const cn=hr.cells.length;if(hr.cells.length!==[...hr.cells].reduce((a,c)=>a+c.colSpan,0))return;
      body.forEach((r,i)=>r._o=i);
      tb._body=body;tb._n=cn;tb._hd=[...hr.cells];
      tb._hd.forEach((th,ci)=>{
        if(ci===0)return;
        const vals=body.filter(r=>r.cells.length===cn).map(r=>num(r.cells[ci].innerText));
        const nn=vals.filter(v=>v!=null).length;if(!vals.length||nn/vals.length<.6)return;
        th.classList.add('so');th.title='Klik untuk mengurutkan';
        th.addEventListener('click',()=>{
          const k=key(ti),cur=MEM[k];let dir='d';
          if(cur&&cur.col===ci)dir=cur.dir==='d'?'a':cur.dir==='a'?'':'d';
          MEM[k]={col:ci,dir};apply(tb,ci,dir);
        });
      });
      const m=MEM[key(ti)];if(m&&m.dir&&tb._hd[m.col]&&tb._hd[m.col].classList.contains('so'))apply(tb,m.col,m.dir);
    });
  }
  let q=0;const go=()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;try{init()}catch(e){}})};
  new MutationObserver(go).observe(document.body,{childList:true,subtree:true});
  go();
})();
</script>

<script>
window.CSVSRC={name:'waste',S:S,tokos:D.toko,tag:()=>MO[S.b0]+'_'+MO[S.b1],rows:function(){
  const a=S.b0,b=S.b1,m=new Map();
  const ent=(t,br)=>{const k=t*100000+br;let e=m.get(k);if(!e){e={t,b:br,w:0,u:0};m.set(k,e)}return e};
  for(const r of D.w){if(r[0]<a||r[0]>b||!okT(r[1]))continue;ent(r[1],r[2]).w+=r[3]}
  for(const r of D.p){if(r[0]<a||r[0]>b||!okT(r[1]))continue;ent(r[1],r[2]).u+=r[3]}
  const srt=(x,y)=>(D.toko[x].w||'').localeCompare(D.toko[y].w||'')||(D.toko[x].k||'').localeCompare(D.toko[y].k||'')||D.toko[x].n.localeCompare(D.toko[y].n);
  const s1=[['Gerai','Kacab','Wilayah','Barang','Pemakaian','Waste','% waste','Catatan']];
  [...m.values()].filter(e=>e.w>0||e.u>0).sort((x,y)=>srt(x.t,y.t)||y.w-x.w).forEach(e=>{const T=D.toko[e.t];
    s1.push([T.n,T.k||'',T.w||'',D.barang[e.b],e.u,e.w,FLAG.has(e.b)?'n/a':(e.u+e.w>0?e.w/(e.u+e.w)*100:''),T.g?'gabungan beberapa gerai':FLAG.has(e.b)?'pemakaian belum tercatat lengkap':''])});
  if(s1.length<2)return [];
  const bb=byBarang(a,b);
  const s2=[['Barang','Waste total','Waste gerai (tanpa gabungan)','Pemakaian','% waste','Gerai mencatat waste',...MO.slice(a,b+1).map(x=>'Waste '+x)]];
  [...bb].sort((x,y)=>y[1].tot-x[1].tot).forEach(([bi,e])=>s2.push([D.barang[bi],e.tot,e.wn,e.u,FLAG.has(bi)?'n/a':(e.wn+e.u>0?e.wn/(e.wn+e.u)*100:''),e.tk.size,...e.wm.slice(a,b+1)]));
  return [{sfx:'per_gerai_barang',rows:s1},{sfx:'per_barang',rows:s2}]}};
</script>
<script>/* Unduh CSV / ZIP per kacab, wilayah atau gerai. Dipakai semua halaman laporan.
   Halaman mendefinisikan window.CSVSRC = {name, S, tokos, tag(), rows()} sebelum skrip ini jalan.
   rows() mengembalikan array baris (baris pertama = judul kolom) atau beberapa lembar [{sfx, rows}], sesuai filter yang aktif. */
(function(){
  var SRC=window.CSVSRC;if(!SRC)return;
  var enc=new TextEncoder();
  function cell(v){
    if(v==null)return '';
    if(typeof v==='number'){if(!isFinite(v))return '';return Number.isInteger(v)?String(v):String(Math.round(v*100)/100).replace('.',',')}
    v=String(v);return /[";\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  }
  function csvText(rows){return '﻿'+rows.map(function(r){return r.map(cell).join(';')}).join('\r\n')}
  var CT=null;
  function crc(b){
    if(!CT){CT=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CT[n]=c>>>0}}
    var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;
  }
  function zip(files){ /* files:[{name,data:Uint8Array}], tanpa kompresi */
    var parts=[],cd=[],off=0,now=new Date();
    var tm=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1),dt=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
    files.forEach(function(f){
      var nm=enc.encode(f.name),c=crc(f.data),sz=f.data.length;
      var h=new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);
      h.setUint32(14,c,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
      parts.push(new Uint8Array(h.buffer),nm,f.data);
      var e=new DataView(new ArrayBuffer(46));
      e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(10,0,true);e.setUint16(12,tm,true);e.setUint16(14,dt,true);
      e.setUint32(16,c,true);e.setUint32(20,sz,true);e.setUint32(24,sz,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
      cd.push(new Uint8Array(e.buffer),nm);off+=30+nm.length+sz;
    });
    var cs=0;cd.forEach(function(x){cs+=x.length});
    var en=new DataView(new ArrayBuffer(22));
    en.setUint32(0,0x06054b50,true);en.setUint16(8,files.length,true);en.setUint16(10,files.length,true);en.setUint32(12,cs,true);en.setUint32(16,off,true);
    return new Blob(parts.concat(cd,[new Uint8Array(en.buffer)]),{type:'application/zip'});
  }
  function save(blob,name){
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
  }
  var fn=function(s){return String(s).replace(/[\\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,80)||'data'};
  function sheetsOf(r){
    if(!r||!r.length)return [];
    return Array.isArray(r[0])?[{sfx:'',rows:r}]:r.filter(function(s){return s&&s.rows&&s.rows.length>1});
  }
  var S=SRC.S,T=SRC.tokos;
  function label(){
    if(S.toko!==''&&S.toko!=null)return T[+S.toko].n;
    return S.kac||S.wil||'semua';
  }
  function inScope(i){
    var t=T[i];if(t.g)return false;
    if(S.toko!==''&&S.toko!=null)return i===+S.toko;
    if(S.wil&&t.w!==S.wil)return false;
    if(S.kac&&t.k!==S.kac)return false;
    return true;
  }
  function msg(t){var m=document.getElementById('csvm');if(m)m.textContent=t}
  function one(){
    var sh=sheetsOf(SRC.rows());
    if(!sh.length){msg('Tidak ada data untuk filter ini.');return}
    var base=SRC.name+'_'+SRC.tag()+'_'+fn(label());
    if(sh.length===1){save(new Blob([csvText(sh[0].rows)],{type:'text/csv;charset=utf-8'}),base+'.csv');msg(sh[0].rows.length-1+' baris.');return}
    var files=sh.map(function(s){return {name:base+'_'+s.sfx+'.csv',data:enc.encode(csvText(s.rows))}});
    save(zip(files),base+'.zip');msg(files.length+' lembar di dalam ZIP.');
  }
  function many(){
    var mode=document.getElementById('csvg').value,groups=new Map();
    for(var i=0;i<T.length;i++){
      if(!inScope(i))continue;var t=T[i];
      var k=mode==='k'?(t.k||'(tanpa kacab)'):mode==='w'?(t.w||'(tanpa wilayah)'):t.n;
      if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);
    }
    if(!groups.size){msg('Tidak ada gerai untuk filter ini.');return}
    var files=[],used={},prev=S.set,k;
    msg('Menyiapkan '+groups.size+' file ...');
    setTimeout(function(){
      try{
        groups.forEach(function(idx,key){
          S.set=new Set(idx);
          var sh=sheetsOf(SRC.rows());
          sh.forEach(function(s){
            var nm=SRC.name+'_'+SRC.tag()+'_'+fn(key)+(s.sfx?'_'+s.sfx:'');var u=nm,n=2;
            while(used[u.toLowerCase()]){u=nm+'-'+(n++)}
            used[u.toLowerCase()]=1;files.push({name:u+'.csv',data:enc.encode(csvText(s.rows))});
          });
        });
      }finally{S.set=prev}
      if(!files.length){msg('Tidak ada data untuk filter ini.');return}
      save(zip(files),SRC.name+'_'+SRC.tag()+'_per-'+(mode==='k'?'kacab':mode==='w'?'wilayah':'gerai')+'.zip');
      msg(files.length+' file CSV di dalam ZIP.');
    },30);
  }
  function ui(){
    var st=document.createElement('style');
    st.textContent='.csvbar{max-width:1240px;margin:0 auto;padding:8px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}'+
      '.csvbar b{color:var(--tx)}.csvbar button,.csvbar select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;font-size:12px}'+
      '.csvbar button{cursor:pointer}.csvbar button:hover{border-color:var(--ac);color:var(--act)}body.emb .csvbar{display:none}@media(max-width:600px){.csvbar{padding-left:12px;padding-right:12px}}';
    document.head.appendChild(st);
    var bar=document.createElement('div');bar.className='csvbar';
    bar.innerHTML='<b>Unduh data</b><button type="button" id="csv1" title="Isi mengikuti filter di atas">CSV sesuai filter</button>'+
      '<span>atau satu file per</span><select id="csvg"><option value="k">Kacab</option><option value="w">Wilayah</option><option value="t">Gerai</option></select>'+
      '<button type="button" id="csv2" title="ZIP berisi satu CSV untuk tiap kacab / wilayah / gerai di dalam filter wilayah, kacab, toko yang aktif">Unduh ZIP</button><span id="csvm"></span>';
    var f=document.querySelector('.filters');
    if(f&&f.parentNode)f.parentNode.insertBefore(bar,f.nextSibling);else document.body.insertBefore(bar,document.body.firstChild);
    document.getElementById('csv1').onclick=function(){try{one()}catch(e){msg('Gagal: '+e.message)}};
    document.getElementById('csv2').onclick=function(){try{many()}catch(e){S.set=null;msg('Gagal: '+e.message)}};
  }
  window.CSVKIT={csvText:csvText,zip:zip,crc:crc};
  ui();
})();
</script>
