<script>
/* Urut kolom angka: klik judul kolom (tinggi->rendah, rendah->tinggi, urutan awal). Berlaku untuk semua tabel. */
(function(){
  const st=document.createElement('style');
  st.textContent='th.so{cursor:pointer;user-select:none;white-space:nowrap}th.so:hover{color:var(--act,#c2410c)}th.so::after{content:"\\2195";opacity:.35;margin-left:5px;font-size:11px}th.so.d::after{content:"\\25BC";opacity:1;color:var(--act,#c2410c)}th.so.a::after{content:"\\25B2";opacity:1;color:var(--act,#c2410c)}';
  document.head.appendChild(st);
  const MEM={};
  function num(t){
    t=(t||'').replace(/−/g,'-').trim();if(!t)return null;
    const m=t.match(/^(?:Rp\s*|[^\d\-+A-Za-z]{0,3}\s*)?([+\-]?\d[\d.,]*)(.*)$/);if(!m)return null;
    if(/^\d{4}-\d{2}/.test(t)||m[2].length>14)return null;
    let s=m[1].replace(/^\+/,''),neg=s[0]==='-';s=s.replace(/^-/,'');
    if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
    let v=parseFloat(s);if(isNaN(v))return null;if(neg)v=-v;
    const r=m[2];
    if(/^\s*M\b/.test(r))v*=1e9;else if(/^\s*jt\b/.test(r))v*=1e6;else if(/^Rp/.test(t))v*=1;
    return v;
  }
  function key(i){let t='';try{t=(typeof S!=='undefined'&&S.tab)||''}catch(e){}return t+'#'+i}
  function apply(tb,col,dir){
    const rows=tb._body,cn=tb._n;
    const ok=rows.filter(r=>r.cells.length===cn);
    const bad=rows.filter(r=>r.cells.length!==cn);
    let ord;
    if(!dir)ord=ok.slice().sort((a,b)=>a._o-b._o);
    else{
      const val=new Map(ok.map(r=>[r,num(r.cells[col].innerText)]));
      ord=ok.slice().sort((a,b)=>{const x=val.get(a),y=val.get(b);
        if(x==null&&y==null)return a._o-b._o;if(x==null)return 1;if(y==null)return -1;
        return (dir==='d'?y-x:x-y)||(a._o-b._o)});
    }
    const par=ok.length?ok[0].parentNode:null;if(!par)return;
    ord.concat(bad).forEach(r=>par.appendChild(r));
    tb._hd.forEach((th,i)=>{th.classList.remove('d','a');if(i===col&&dir)th.classList.add(dir)});
  }
  function init(){
    [...document.querySelectorAll('table')].forEach((tb,ti)=>{
      if(tb.dataset.so)return;tb.dataset.so='1';
      const all=[...tb.rows];let h=0;while(h<all.length&&[...all[h].cells].every(c=>c.tagName==='TH'))h++;
      if(!h)return;const hr=all[h-1],body=all.slice(h);
      if(body.length<2||body.some(r=>[...r.cells].some(c=>c.tagName==='TH')))return;
      const cn=hr.cells.length;if(hr.cells.length!==[...hr.cells].reduce((a,c)=>a+c.colSpan,0))return;
      body.forEach((r,i)=>r._o=i);
      tb._body=body;tb._n=cn;tb._hd=[...hr.cells];
      tb._hd.forEach((th,ci)=>{
        if(ci===0)return;
        const vals=body.filter(r=>r.cells.length===cn).map(r=>num(r.cells[ci].innerText));
        const nn=vals.filter(v=>v!=null).length;if(!vals.length||nn/vals.length<.6)return;
        th.classList.add('so');th.title='Klik untuk mengurutkan';
        th.addEventListener('click',()=>{
          const k=key(ti),cur=MEM[k];let dir='d';
          if(cur&&cur.col===ci)dir=cur.dir==='d'?'a':cur.dir==='a'?'':'d';
          MEM[k]={col:ci,dir};apply(tb,ci,dir);
        });
      });
      const m=MEM[key(ti)];if(m&&m.dir&&tb._hd[m.col]&&tb._hd[m.col].classList.contains('so'))apply(tb,m.col,m.dir);
    });
  }
  let q=0;const go=()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;try{init()}catch(e){}})};
  new MutationObserver(go).observe(document.body,{childList:true,subtree:true});
  go();
})();
</script>

window.CSVSRC={name:'pola-jam',S:S,tokos:D.toko,tag:()=>MO[S.b0]+'_'+MO[S.b1],rows:function(){
  const pm=perToko(S.b0,S.b1),u=MU[S.m];
  const s1=[['Gerai','Kacab','Wilayah','Hari-gerai berdata','Total per hari ('+u+')',...DP.map(d=>d.n+' per hari ('+u+')'),'Jam tersibuk',...Array.from({length:24},(_,j)=>hh(j)+' ('+u+' per hari)')]];
  const srt=(a,b)=>(D.toko[a].w||'').localeCompare(D.toko[b].w||'')||(D.toko[a].k||'').localeCompare(D.toko[b].k||'')||D.toko[a].n.localeCompare(D.toko[b].n);
  [...pm.keys()].filter(t=>okT(t)&&pm.get(t).den>0).sort(srt).forEach(t=>{const e=pm.get(t),a=e.n.map(v=>v/e.den),T=D.toko[t],mx=Math.max(...a);
    s1.push([T.n,T.k||'',T.w||'',e.den,a.reduce((x,y)=>x+y,0),...dpSum(a),mx>0?hh(a.indexOf(mx)):'',...a])});
  if(s1.length<2)return [];
  const c=calc(S.b0,S.b1),DWn=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const s2=[['Hari','Hari-gerai berdata',...Array.from({length:24},(_,j)=>hh(j)+' ('+u+' per hari)')]];
  for(let d=0;d<7;d++)if(c.den[d]>0)s2.push([DWn[d],c.den[d],...c.num[d].map(v=>v/c.den[d])]);
  return [{sfx:'per_gerai',rows:s1},{sfx:'hari_jam',rows:s2}]}};

<script>/* Unduh CSV / ZIP per kacab, wilayah atau gerai. Dipakai semua halaman laporan.
   Halaman mendefinisikan window.CSVSRC = {name, S, tokos, tag(), rows()} sebelum skrip ini jalan.
   rows() mengembalikan array baris (baris pertama = judul kolom) atau beberapa lembar [{sfx, rows}], sesuai filter yang aktif. */
(function(){
  var SRC=window.CSVSRC;if(!SRC)return;
  var enc=new TextEncoder();
  function cell(v){
    if(v==null)return '';
    if(typeof v==='number'){if(!isFinite(v))return '';return Number.isInteger(v)?String(v):String(Math.round(v*100)/100).replace('.',',')}
    v=String(v);return /[";\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  }
  function csvText(rows){return '﻿'+rows.map(function(r){return r.map(cell).join(';')}).join('\r\n')}
  var CT=null;
  function crc(b){
    if(!CT){CT=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CT[n]=c>>>0}}
    var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;
  }
  function zip(files){ /* files:[{name,data:Uint8Array}], tanpa kompresi */
    var parts=[],cd=[],off=0,now=new Date();
    var tm=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1),dt=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
    files.forEach(function(f){
      var nm=enc.encode(f.name),c=crc(f.data),sz=f.data.length;
      var h=new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);
      h.setUint32(14,c,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
      parts.push(new Uint8Array(h.buffer),nm,f.data);
      var e=new DataView(new ArrayBuffer(46));
      e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(10,0,true);e.setUint16(12,tm,true);e.setUint16(14,dt,true);
      e.setUint32(16,c,true);e.setUint32(20,sz,true);e.setUint32(24,sz,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
      cd.push(new Uint8Array(e.buffer),nm);off+=30+nm.length+sz;
    });
    var cs=0;cd.forEach(function(x){cs+=x.length});
    var en=new DataView(new ArrayBuffer(22));
    en.setUint32(0,0x06054b50,true);en.setUint16(8,files.length,true);en.setUint16(10,files.length,true);en.setUint32(12,cs,true);en.setUint32(16,off,true);
    return new Blob(parts.concat(cd,[new Uint8Array(en.buffer)]),{type:'application/zip'});
  }
  function save(blob,name){
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
  }
  var fn=function(s){return String(s).replace(/[\\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,80)||'data'};
  function sheetsOf(r){
    if(!r||!r.length)return [];
    return Array.isArray(r[0])?[{sfx:'',rows:r}]:r.filter(function(s){return s&&s.rows&&s.rows.length>1});
  }
  var S=SRC.S,T=SRC.tokos;
  function label(){
    if(S.toko!==''&&S.toko!=null)return T[+S.toko].n;
    return S.kac||S.wil||'semua';
  }
  function inScope(i){
    var t=T[i];if(t.g)return false;
    if(S.toko!==''&&S.toko!=null)return i===+S.toko;
    if(S.wil&&t.w!==S.wil)return false;
    if(S.kac&&t.k!==S.kac)return false;
    return true;
  }
  function msg(t){var m=document.getElementById('csvm');if(m)m.textContent=t}
  function one(){
    var sh=sheetsOf(SRC.rows());
    if(!sh.length){msg('Tidak ada data untuk filter ini.');return}
    var base=SRC.name+'_'+SRC.tag()+'_'+fn(label());
    if(sh.length===1){save(new Blob([csvText(sh[0].rows)],{type:'text/csv;charset=utf-8'}),base+'.csv');msg(sh[0].rows.length-1+' baris.');return}
    var files=sh.map(function(s){return {name:base+'_'+s.sfx+'.csv',data:enc.encode(csvText(s.rows))}});
    save(zip(files),base+'.zip');msg(files.length+' lembar di dalam ZIP.');
  }
  function many(){
    var mode=document.getElementById('csvg').value,groups=new Map();
    for(var i=0;i<T.length;i++){
      if(!inScope(i))continue;var t=T[i];
      var k=mode==='k'?(t.k||'(tanpa kacab)'):mode==='w'?(t.w||'(tanpa wilayah)'):t.n;
      if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);
    }
    if(!groups.size){msg('Tidak ada gerai untuk filter ini.');return}
    var files=[],used={},prev=S.set,k;
    msg('Menyiapkan '+groups.size+' file ...');
    setTimeout(function(){
      try{
        groups.forEach(function(idx,key){
          S.set=new Set(idx);
          var sh=sheetsOf(SRC.rows());
          sh.forEach(function(s){
            var nm=SRC.name+'_'+SRC.tag()+'_'+fn(key)+(s.sfx?'_'+s.sfx:'');var u=nm,n=2;
            while(used[u.toLowerCase()]){u=nm+'-'+(n++)}
            used[u.toLowerCase()]=1;files.push({name:u+'.csv',data:enc.encode(csvText(s.rows))});
          });
        });
      }finally{S.set=prev}
      if(!files.length){msg('Tidak ada data untuk filter ini.');return}
      save(zip(files),SRC.name+'_'+SRC.tag()+'_per-'+(mode==='k'?'kacab':mode==='w'?'wilayah':'gerai')+'.zip');
      msg(files.length+' file CSV di dalam ZIP.');
    },30);
  }
  function ui(){
    var st=document.createElement('style');
    st.textContent='.csvbar{max-width:1240px;margin:0 auto;padding:8px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}'+
      '.csvbar b{color:var(--tx)}.csvbar button,.csvbar select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;font-size:12px}'+
      '.csvbar button{cursor:pointer}.csvbar button:hover{border-color:var(--ac);color:var(--act)}body.emb .csvbar{display:none}@media(max-width:600px){.csvbar{padding-left:12px;padding-right:12px}}';
    document.head.appendChild(st);
    var bar=document.createElement('div');bar.className='csvbar';
    bar.innerHTML='<b>Unduh data</b><button type="button" id="csv1" title="Isi mengikuti filter di atas">CSV sesuai filter</button>'+
      '<span>atau satu file per</span><select id="csvg"><option value="k">Kacab</option><option value="w">Wilayah</option><option value="t">Gerai</option></select>'+
      '<button type="button" id="csv2" title="ZIP berisi satu CSV untuk tiap kacab / wilayah / gerai di dalam filter wilayah, kacab, toko yang aktif">Unduh ZIP</button><span id="csvm"></span>';
    var f=document.querySelector('.filters');
    if(f&&f.parentNode)f.parentNode.insertBefore(bar,f.nextSibling);else document.body.insertBefore(bar,document.body.firstChild);
    document.getElementById('csv1').onclick=function(){try{one()}catch(e){msg('Gagal: '+e.message)}};
    document.getElementById('csv2').onclick=function(){try{many()}catch(e){S.set=null;msg('Gagal: '+e.message)}};
  }
  window.CSVKIT={csvText:csvText,zip:zip,crc:crc};
  ui();
})();
</script>
</body>
