<script>
(function(){
const S = DATA.slides, TOTAL = S.length;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const fmtM = v => v>=1e6 ? (v/1e6).toFixed(2)+'M' : Math.round(v/1e3)+'Rb';
const fmtJt = v => Math.round(v/1e6)+' Jt';

function chart(labels, values, o={}){
  const W=o.w||548, H=o.h||250, padB=26, padT=10, n=labels.length, gap=14;
  const bw=(W-gap*(n+1))/n, mx=Math.max(...values.filter(v=>v))||1, ch=H-padB-padT;
  let g='';
  values.forEach((v,i)=>{
    const x=gap+i*(bw+gap);
    const last=i===n-1;
    if(v){
      const h=Math.max(6,v/mx*ch), y=padT+ch-h, inside=h>=30;
      g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="${last?'#1d4ed8':'#2563eb'}"/>`;
      g+=`<text x="${x+bw/2}" y="${inside?y+18:y-5}" text-anchor="middle" font-size="${n>8?11.5:13}" font-weight="700" fill="${inside?'#fff':'#1e3a8a'}">${(o.fmt||fmtM)(v)}</text>`;
    } else {
      g+=`<text x="${x+bw/2}" y="${padT+ch-6}" text-anchor="middle" font-size="11" fill="#94a3b8">tutup</text>`;
    }
    g+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b">${labels[i]}</text>`;
  });
  g+=`<line x1="0" y1="${padT+ch+1}" x2="${W}" y2="${padT+ch+1}" stroke="#cbd5e1" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}</svg>`;
}

function chart2(labels, values, o={}){
  const W=o.w||340,H=o.h||290,n=labels.length,gap=7,padT=18,padB=o.sub?46:28;
  const bw=(W-gap*(n+1))/n, vs=values.map(v=>v==null?null:v), ok=vs.filter(v=>v!=null);
  const pos=Math.max(0,...ok), neg=Math.max(0,...ok.map(v=>-v)), tot=(pos+neg)||1, ch=H-padB-padT-(neg>0?16:0), base=padT+ch*(pos/tot), sc=ch/tot;
  const f1=v=>(v/1e6).toFixed(1).replace('.',',');
  let g='';
  vs.forEach((v,i)=>{
    const x=gap+i*(bw+gap), cx=x+bw/2, last=i===n-1;
    if(!v&&v!==0||v==null){ g+=`<text x="${cx}" y="${base-6}" text-anchor="middle" font-size="10.5" fill="#94a3b8">${o.nul||'-'}</text>`; }
    else {
      const h=Math.abs(v)*sc, col=v<0?o.neg:(last?o.last:o.pos);
      if(v!==0) g+=`<rect x="${x}" y="${v>=0?base-h:base}" width="${bw}" height="${Math.max(2,h)}" rx="4" fill="${col}"/>`;
      g+=`<text x="${cx}" y="${v>=0?base-Math.max(2,h)-5:base+h+13}" text-anchor="middle" font-size="${o.fs||10.5}" font-weight="700" fill="${v<0?o.neg:'#1e3a8a'}">${o.fmt?o.fmt(v):f1(v)}</text>`;
    }
    g+=`<text x="${cx}" y="${H-padB+16}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">${labels[i]}</text>`;
    if(o.sub&&o.sub[i]!=null) g+=`<text x="${cx}" y="${H-padB+31}" text-anchor="middle" font-size="10" font-weight="${last?800:600}" fill="${last?'#0f172a':'#94a3b8'}">${String(o.sub[i]).replace('.',',')}%</text>`;
  });
  g+=`<line x1="0" y1="${base+1}" x2="${W}" y2="${base+1}" stroke="#cbd5e1" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}</svg>`;
}
const wr = s => s.waste ? `<div class="wr"><b>${esc(s.waste.title)}</b>${s.waste.labels.map((l,k)=>`<div><i>${l}</i><span>${s.waste.values[k]==null?'–':(s.waste.values[k]/1e6).toFixed(1).replace('.',',')+' Jt'}</span><em>${s.waste.pct[k]==null?'':String(s.waste.pct[k]).replace('.',',')+'% omzet'}</em></div>`).join('')}<small>Okt belum ada data</small></div>` : '';
const fb = v => v==null ? '–' : (v>=1e9 ? (v/1e9).toFixed(2).replace('.',',')+' M' : (v/1e6).toFixed(1).replace('.',',')+' Jt');
const br = s => s.biaya ? `<div class="wr bh"><b>${esc(s.biaya.title)}</b>${s.biaya.labels.map((l,k)=>`<div><i>${l}</i><span>${fb(s.biaya.values[k])}</span><em>${s.biaya.pct[k]==null?'':s.biaya.pct[k].toFixed(1).replace('.',',')+'% omzet'}</em></div>`).join('')}</div>` : '';
const br2 = s => s.omzet ? `<div class="wr om"><b>${esc(s.omzet.title)}</b>${s.omzet.labels.map((l,k)=>{const g=s.omzet.growth[k];return `<div><i>${l}</i><span>${fb(s.omzet.values[k])}</span><em class="${g==null?'':(g>=0?'up':'dn')}">${g==null?'&nbsp;':(g>=0?'+':'')+g.toFixed(1).replace('.',',')+'% vs bln lalu'}</em></div>`}).join('')}</div>` : '';
const hd = s => `<div class="hd"><div><h3>${esc(s.title)}</h3><p>${esc(s.sub)}</p></div>${s.badge?`<span class="pill t-${s.badge.tone}">${esc(s.badge.text)}</span>`:''}</div>`;
const foot = (s,i) => `<div class="foot">Sumber: Dashboard Tracking Sales & Budget Hisana Surabaya Raya · ${i+1}/${TOTAL}</div>`;
const cards = c => `<div class="cards">${c.map(k=>`<div class="kc ${k.tone}"><b>${esc(k.v)}</b><span>${esc(k.l)}</span></div>`).join('')}</div>`;

function html(s,i){
  if(s.t==='cover') return `<div class="slide cover"><span class="pill">${esc(s.tag)}</span><h2>${esc(s.title)}</h2><p>${esc(s.sub)}</p><div class="rule"></div><div class="meta">Disusun 4 November 2026 · Data penjualan s/d 3 November 2026</div></div>`;
  if(s.t==='area') return `<div class="slide">${hd(s)}${cards(s.cards)}
    <div class="cols"><div class="card" style="width:640px;min-height:372px"><h4>${esc(s.chartTitle)}</h4>${chart(s.labels,s.values,{w:588,h:300,fmt:fmtJt})}</div>
    <div class="card right" style="min-height:372px"><h4>Total Area · Oktober 2026</h4><div class="kpilist">${s.kpis.map(k=>`<div>${esc(k.k)}<b>${esc(k.v)}</b></div>`).join('')}</div></div></div>${foot(s,i)}</div>`;
  if(s.t==='table'){
    const w=s.widths, sum=w.reduce((a,b)=>a+b,0);
    return `<div class="slide">${hd(s)}${s.cards?cards(s.cards):''}<div class="card ${s.rows.length>16?'xdc':''}" style="${s.rows.length>16?'':'padding:16px 24px'}"><h4>${esc(s.tableTitle)}</h4>
    <table class="t ${s.rows.length>16?'xd':s.dense?'dense':''} ${s.cols.length>8?'wd':''}"><colgroup>${w.map(x=>`<col style="width:${x/sum*100}%">`).join('')}</colgroup>
    <thead><tr>${s.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${s.rows.map(r=>`<tr>${r.map(c=>typeof c==='object'?(c.sub!==undefined?`<td title="${esc(c.tip||'')}">${esc(c.text)}<span class="mm ${c.tone||''}">${esc(c.sub)}</span></td>`:`<td><span class="chip t-${c.tone}">${esc(c.text)}</span></td>`):`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>${foot(s,i)}</div>`;
  }
  if(s.t==='store') return `<div class="slide">${hd(s)}<div class="cols">
    <div class="card left"><h4>${esc(s.chartTitle)}</h4>${chart(s.labels,s.values,{w:548,h:214})}
      <div class="tiles">${s.tiles.map(t=>`<div class="tile"><i>${esc(t.k)}</i><b class="${t.tone||''}">${esc(t.v)}</b>${t.s?`<span class="ts ${t.st||''}">${esc(t.s)}</span>`:''}</div>`).join('')}</div>
      <p class="fin">${rich(s.fin)}</p></div>
    <div class="card right"><h4>Evaluasi & Action Plan</h4><div class="eh">Evaluasi Kunci:</div><ul class="b">${s.eval.map(e=>`<li>${rich(e)}</li>`).join('')}</ul>
      <div class="eh">Saran Perbaikan (Action Plan):</div><ul class="b">${s.actions.map(a=>`<li><b>${esc(a.h)}:</b> ${rich(a.b)}</li>`).join('')}</ul></div></div>${foot(s,i)}</div>`;
  if(s.t==='kc'){
    const cc=(c,svg,note)=>`<div class="card c3c"><h4>${esc(c.title)}</h4><div class="hl"><b>${esc(c.hl)}</b>${c.hl2?`<em>${esc(c.hl2)}</em>`:''}</div><div class="hs ${c.tone||'gray'}">${esc(c.sub)}</div>${svg}${note?`<div class="cn">${note}</div>`:''}</div>`;
    const m=s.mlabels, sa=s.sales;
    return `<div class="slide">${hd(s)}<div class="c3">
      ${cc(sa,chart2(sa.labels,sa.values.map(v=>v||null),{h:188,fs:9.5,sub:sa.labels.map(()=>null),pos:'#2563eb',last:'#1d4ed8',neg:'#dc2626',nul:'tutup'}),'Nilai Rp Juta per hari (jumlah seluruh gerai)')}
      ${cc(s.cogs,chart2(m,s.cogs.values,{h:188,pos:'#f59e0b',last:'#d97706',neg:'#dc2626',sub:s.cogs.pct}),'Angka di bawah bulan = COGS % dari sales · nilai Rp Juta')}
      ${cc(s.np,chart2(m,s.np.values,{h:188,pos:'#22c55e',last:'#15803d',neg:'#dc2626',sub:s.np.pct}),'Angka di bawah bulan = net margin % · nilai Rp Juta')}
    </div>${wr(s)}${br(s)}${br2(s)}<div class="strip">${s.strip.map(t=>`<div class="tile"><i>${esc(t.k)}</i><b class="${t.tone||''}">${esc(t.v)}</b></div>`).join('')}</div>${foot(s,i)}</div>`;
  }
  if(s.t==='kg'){
    const gs=s.rows.map(r=>r.gap), mn=Math.min(0,...gs), mx=Math.max(0,...gs), sp=(mx-mn)||1, z=(-mn)/sp*100;
    return `<div class="slide">${hd(s)}<div class="card rkc"><table class="rkt"><thead><tr><th>NO</th><th>NAMA STORE</th><th>% CAPAI</th><th>SELISIH KE BUDGET (Rp)</th><th>PORSI KEKURANGAN</th></tr></thead><tbody>${s.rows.map((r,k)=>{const w=Math.abs(r.gap)/sp*100,l=r.gap>=0?z:z-w,tn=r.gap>0?'red':'green';return `<tr><td class="n">${k+1}</td><td class="nm">${esc(r.name)}</td><td><b class="${r.pt}">${esc(r.pct)}</b></td><td class="bcell"><span class="trk wide"><i class="${tn}" style="left:${l}%;width:${w}%"></i><u style="left:${z}%"></u></span><b class="${tn}">${esc(r.gt)}</b></td><td>${esc(r.share)}</td></tr>`}).join('')}</tbody></table></div>${foot(s,i)}</div>`;
  }
  if(s.t==='rk') return `<div class="slide">${hd(s)}<div class="card rkc"><table class="rkt"><thead><tr><th>NO</th><th>KEPALA CABANG</th><th>GERAI</th><th>OMZET OKT / BUDGET</th><th>% CAPAI BUDGET</th><th>GERAI TEMBUS TARGET</th></tr></thead><tbody>${s.rows.map((r,k)=>`<tr><td class="n">${k+1}</td><td class="nm">${esc(r.name)}${r.mark?`<span class="mk ${r.mk}">${r.mark}</span>`:''}</td><td>${r.n}</td><td>${esc(r.ov)}</td><td class="bcell"><span class="trk"><i class="${r.tone}" style="left:0;width:${Math.min(100,r.pct/120*100)}%"></i><u style="left:${100/120*100}%"></u></span><b class="${r.tone}">${esc(r.pctt)}</b></td><td>${esc(r.hitt)}</td></tr>`).join('')}</tbody></table></div>${foot(s,i)}</div>`;
  if(s.t==='rp'){
    const ms=s.rows.map(r=>r.m), mn=Math.min(0,...ms), mx=Math.max(...ms), sp=(mx-mn)||1, z=(-mn)/sp*100;
    return `<div class="slide">${hd(s)}<div class="card rkc"><table class="rkt"><thead><tr><th>NO</th><th>KEPALA CABANG</th><th>COGS % DARI SALES (vs ${esc(s.pl)})</th><th>NET PROFIT ${esc(s.cl.toUpperCase())}</th><th>vs ${esc(s.pl.toUpperCase())} 2026</th><th>NET MARGIN</th></tr></thead><tbody>${s.rows.map((r,k)=>{const w=Math.abs(r.m)/sp*100, l=r.m>=0?z:z-w;return `<tr><td class="n">${k+1}</td><td class="nm">${esc(r.name)}</td><td>${esc(r.cogs)} <em class="dd ${r.ct}">${esc(r.cd)}</em></td><td>${esc(r.np)}</td><td><b class="${r.nt}">${esc(r.nd)}</b></td><td class="bcell"><span class="trk"><i class="${r.m>=0?'green':'red'}" style="left:${l}%;width:${w}%"></i><u style="left:${z}%"></u></span><b class="${r.m>=0?'green':'red'}">${r.m.toFixed(1).replace('.',',')}%</b></td></tr>`}).join('')}</tbody></table></div>${foot(s,i)}</div>`;
  }
  if(s.t==='ac'){
    const cc=(c,svg,note)=>`<div class="card c3c"><h4>${esc(c.title)}</h4><div class="hl"><b>${esc(c.hl)}</b>${c.hl2?`<em>${esc(c.hl2)}</em>`:''}</div><div class="hs ${c.tone||'gray'}">${esc(c.sub)}</div>${svg}${note?`<div class="cn">${note}</div>`:''}</div>`;

    const m=s.mlabels, sa=s.sales;
    return `<div class="slide">${hd(s)}<div class="c3">
      ${cc(sa,chart2(sa.labels,sa.values.map(v=>v||null),{h:188,fs:9.5,sub:sa.labels.map(()=>null),pos:'#2563eb',last:'#1d4ed8',neg:'#dc2626',nul:'tutup',fmt:v=>(v/1e6).toFixed(2).replace('.',',')+'M'}),'')}
      ${cc(s.cogs,chart2(m,s.cogs.values,{h:188,pos:'#f59e0b',last:'#d97706',neg:'#dc2626',sub:s.cogs.pct}),'Angka di bawah bulan = COGS % dari sales · nilai Rp Juta')}
      ${cc(s.np,chart2(m,s.np.values,{h:188,pos:'#22c55e',last:'#15803d',neg:'#dc2626',sub:s.np.pct}),'Angka di bawah bulan = net margin % · nilai Rp Juta')}
    </div>${wr(s)}${br(s)}${br2(s)}<div class="strip">${s.strip.map(t=>`<div class="tile"><i>${esc(t.k)}</i><b class="${t.tone||''}">${esc(t.v)}</b></div>`).join('')}</div>${foot(s,i)}</div>`;
  }
  if(s.t==='sev') return `<div class="slide sev">${hd(s)}<div class="card ev">
    <div class="evc"><div class="eh">Evaluasi Kunci:</div><ul class="b">${s.eval.map(e=>`<li>${rich(e)}</li>`).join('')}</ul></div>
    <div class="evc"><div class="eh">Saran Perbaikan (Action Plan):</div><ul class="b">${s.actions.map(a=>`<li><b>${esc(a.h)}:</b> ${rich(a.b)}</li>`).join('')}</ul></div>
    <p class="fin">${rich(s.fin)}</p></div>${foot(s,i)}</div>`;
  if(s.t==='reko') return `<div class="slide">${hd(s)}<div class="reko ${s.cols.length>3?'c4':''}">${s.cols.map(c=>`<div class="rc ${c.tone}"><h4>${esc(c.h)}</h4><p>${rich(c.b)}</p></div>`).join('')}</div><div class="banner">${esc(s.banner)}</div>${foot(s,i)}</div>`;
  return '';
}

// ---------- render ----------
const wrap=document.getElementById('wrap');
wrap.innerHTML=S.map((s,i)=>`<section class="sw" id="s${i}" data-k="${s.kacab||''}">${html(s,i)}</section>`).join('');
function fit(){const w=wrap.querySelector('.sw').clientWidth;document.documentElement.style.setProperty('--s',w/1280)}
window.addEventListener('resize',fit);fit();
window.addEventListener('beforeprint',()=>document.documentElement.style.setProperty('--s',1));
window.addEventListener('afterprint',fit);

// ---------- navigation ----------
const selK=document.getElementById('selK');
selK.innerHTML='<option value="">Lompat ke… (cover / area)</option><option value="1">Ringkasan Area</option><option value="3">Peringkat 20 Kepala Cabang</option>'+
  DATA.sections.map(x=>`<option value="${x.start}">Kepala Cabang ${x.kacab} (${x.n} gerai)</option>`).join('')+`<option value="${TOTAL-1}">Rekomendasi Strategis Area</option>`;
selK.onchange=()=>{if(selK.value!=='')document.getElementById('s'+selK.value).scrollIntoView({behavior:'smooth'});selK.selectedIndex=0};
document.getElementById('dl').innerHTML=DATA.stores.map(x=>`<option value="${esc(x.name)}">${x.kacab}</option>`).join('');
const srch=document.getElementById('srch');
srch.addEventListener('change',()=>{const q=srch.value.trim().toUpperCase();if(!q)return;
  const m=DATA.stores.find(x=>x.name===q)||DATA.stores.find(x=>x.name.includes(q));
  if(m){document.getElementById('s'+m.id).scrollIntoView({behavior:'smooth'});srch.value=''}else toast('Gerai tidak ditemukan')});

// ---------- presenter ----------
const pres=document.getElementById('pres'),stage=document.getElementById('stage');let cur=0;
function show(i){cur=Math.max(0,Math.min(TOTAL-1,i));stage.innerHTML=html(S[cur],cur).replace('class="slide','style="transform:none" class="slide');
  const k=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${k})`}
document.getElementById('bPres').onclick=()=>{const vis=[...wrap.children].findIndex(e=>e.getBoundingClientRect().bottom>200);pres.classList.add('on');show(Math.max(0,vis));pres.requestFullscreen&&pres.requestFullscreen().catch(()=>{})};
document.addEventListener('keydown',e=>{if(!pres.classList.contains('on'))return;
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();show(cur+1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}
  else if(e.key==='Escape'){pres.classList.remove('on');document.fullscreenElement&&document.exitFullscreen()}});
pres.addEventListener('click',e=>{show(e.clientX>innerWidth/2?cur+1:cur-1)});
addEventListener('resize',()=>{if(pres.classList.contains('on'))show(cur)});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)pres.classList.remove('on')});

function toast(m,ms=5000){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms)}

// ---------- PDF ----------
document.getElementById('bPdf').onclick=()=>{
  toast('Di dialog print: Destination = "Save as PDF", Margins = None, centang "Background graphics". Ukuran halaman otomatis 16:9.',8000);
  setTimeout(()=>window.print(),400);
};

window.__ready=true;
})();
</script>
</body>
</html>
