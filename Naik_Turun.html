  if(Math.abs(br.c[2])>=0.15*Math.abs(dO)&&Math.abs(rr[2])>=0.5)L.push(`Harga per item ${rr[2]>=0?'naik':'turun'} ${fmt1(Math.abs(rr[2]))}%: ${rr[2]<0?'tanda menu murah/paket/promo makin dominan.':'tanda harga atau menu yang lebih mahal makin dominan.'}`);
  const g=res.grp;const gl=g.lfl[0]-g.lfl[1];

  L.push('Asal perubahan: '+gp.join('; ')+'.');
  const cs=res.chn.map((v,c)=>({c,d:v[0]-v[1],p:pct(v[0],v[1]),b:v[1]})).filter(x=>x.b>0||x.d!==0);
  const cu=[...cs].sort((x,y)=>y.d-x.d)[0],cd=[...cs].sort((x,y)=>x.d-y.d)[0];
  const cp=[];if(cu&&cu.d>0)cp.push(`naik terbesar <b>${CH[cu.c]}</b> ${jtS(cu.d)}${cu.p!=null?' ('+sgp(cu.p)+')':''}`);
  if(cd&&cd.d<0)cp.push(`turun terbesar <b>${CH[cd.c]}</b> ${jtS(cd.d)}${cd.p!=null?' ('+sgp(cd.p)+')':''}`);
  if(cp.length)L.push('Channel: '+cp.join(', ')+'.');
  const turun10=res.rows.filter(r=>r.k!=='tutup'&&r.p!=null&&r.p<=-10);
  if(turun10.length){const kc=new Map();turun10.forEach(r=>{const k=D.toko[r.t].k||'(tanpa kacab)';kc.set(k,(kc.get(k)||0)+1)});const tk=[...kc].sort((x,y)=>y[1]-x[1])[0];
    L.push(`${turun10.length} gerai turun ≥10%${kc.size>1&&tk[1]>=2&&tk[1]>([...kc].sort((x,y)=>y[1]-x[1])[1]||[0,0])[1]?`, paling banyak di kacab <b>${esc(tk[0])}</b> (${tk[1]} gerai)`:''}.`)}
  if(J.n){const dj=J.a.map((v,j)=>[j,v-J.b[j]]).filter(x=>J.a[x[0]]>0||J.b[x[0]]>0);
    if(dj.length){const up=[...dj].sort((x,y)=>y[1]-x[1])[0],dn=[...dj].sort((x,y)=>x[1]-y[1])[0];
      L.push(`Jam: ${up[1]>0?`naik terbesar jam <b>${hh(up[0])}:00</b> (+${fmt1(up[1])} item/gerai/hari)`:''}${up[1]>0&&dn[1]<0?', ':''}${dn[1]<0?`turun terbesar jam <b>${hh(dn[0])}:00</b> (${fmt1(dn[1])})`:''}.`)}}
  const mu=[...MN.l].sort((x,y)=>y.d-x.d)[0],md=[...MN.l].sort((x,y)=>x.d-y.d)[0];
  const mp=[];if(mu&&mu.d>0)mp.push(`naik terbesar <b>${esc(mu.n)}</b> ${jtS(mu.d)}`);if(md&&md.d<0)mp.push(`turun terbesar <b>${esc(md.n)}</b> ${jtS(md.d)}`);
  if(mp.length)L.push('Menu: '+mp.join(', ')+'.');
  // ---- KPI
  const kp=(l,v,a,b,f)=>`<div class="kpi"><span>${l}</span><b>${v}</b><span class="d ${cls(pct(a,b))}">${sgp(pct(a,b))}</span><span>${f}</span></div>`;
  const kpis=`<div class="kpis">${kp('Omzet'+u,rpS(T.oa),T.oa,T.ob,'vs '+rpS(T.ob)+' di '+nB)}${kp('Transaksi'+u,fmt(T.xa),T.xa,T.xb,'vs '+fmt(T.xb))}${kp('Item per struk',fmt2(iA),iA,iB,'vs '+fmt2(iB))}${kp('Harga per item','Rp '+fmt(hA),hA,hB,'vs Rp '+fmt(hB))}</div>`;

  // ---- gerai penggerak

  const dn=withD.filter(r=>r.d<0).sort((x,y)=>x.d-y.d).slice(0,S.nrow),up=withD.filter(r=>r.d>0).sort((x,y)=>y.d-x.d).slice(0,S.nrow);
  const gt=(title,l)=>`<div class="card"><h2>${title}<small>Δ omzet${u}, ${nA} vs ${nB}</small></h2><div class="tw"><table><tr><th>Gerai</th><th class="tl">Kacab</th><th>Δ</th><th>%</th><th class="tl">Tipe</th><th class="tl">Penyebab utama</th></tr>${l.length?l.map(r=>`<tr><td>${esc(D.toko[r.t].n)}</td><td class="tl">${esc(D.toko[r.t].k||'–')}</td><td class="${cls(r.d)}"><b>${jtS(r.d)}</b></td><td class="${cls(r.p)}">${sgp(r.p)}</td><td class="tl">${chip(r.k)}</td><td class="tl cause">${esc(cause(r))}</td></tr>`).join(''):'<tr><td colspan="6" class="tl cause">Tidak ada.</td></tr>'}</table></div></div>`;
  // ---- kacab
  const kg=new Map();res.rows.forEach(r=>{const k=D.toko[r.t].k||'(tanpa kacab)';let x=kg.get(k);if(!x){x={oa:0,ob:0,la:0,lb:0,n:0,tn:0};kg.set(k,x)}x.oa+=r.oa;x.ob+=r.ob;x.n++;if(r.k==='lfl'){x.la+=r.oa;x.lb+=r.ob}if(r.k!=='tutup'&&r.p!=null&&r.p<=-10)x.tn++});
  const kacT=kg.size>1?`<div class="card"><h2>Per kacab<small>diurutkan dari yang paling turun</small></h2><div class="tw"><table><tr><th>Kacab</th><th>Gerai</th><th>${nB}</th><th>${nA}</th><th>Δ</th><th>%</th><th>LFL %</th><th>Gerai turun ≥10%</th></tr>${[...kg].sort((x,y)=>(x[1].oa-x[1].ob)-(y[1].oa-y[1].ob)).map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.n}</td><td>${fmt(x.ob/1e6)}</td><td>${fmt(x.oa/1e6)}</td><td class="${cls(x.oa-x.ob)}"><b>${jtS(x.oa-x.ob)}</b></td><td class="${cls(pct(x.oa,x.ob))}">${sgp(pct(x.oa,x.ob))}</td><td class="${cls(pct(x.la,x.lb))}">${sgp(pct(x.la,x.lb))}</td><td>${x.tn||'–'}</td></tr>`).join('')}</table></div><p class="note">Omzet dalam Rp juta. LFL % = hanya gerai yang buka penuh di kedua bulan.</p></div>`:'';
  // ---- channel
  const chT=`<div class="card"><h2>Per channel<small>Rp juta${u}</small></h2><table><tr><th>Channel</th><th>${nB}</th><th>${nA}</th><th>Δ</th><th>%</th><th>Share</th></tr>${res.chn.map((v,c)=>({c,a:v[0],b:v[1]})).filter(x=>x.a>0||x.b>0).map(x=>`<tr><td>${CH[x.c]}</td><td>${fmt(x.b/1e6)}</td><td>${fmt(x.a/1e6)}</td><td class="${cls(x.a-x.b)}"><b>${jtS(x.a-x.b)}</b></td><td class="${cls(pct(x.a,x.b))}">${sgp(pct(x.a,x.b))}</td><td>${fmt1(x.a/T.oa*100)}%</td></tr>`).join('')}</table></div>`;
  // ---- jam
  let jamC='';
  if(J.n){const js=[];for(let j=0;j<24;j++)if(J.a[j]>0||J.b[j]>0)js.push(j);const dj=js.map(j=>J.a[j]-J.b[j]);const jm=Math.max(...dj.map(Math.abs),0.01);
    jamC=`<div class="card"><h2>Pergeseran jam<small>selisih item per gerai per hari (${nA} − ${nB}), ${J.n} gerai ${core(res)[0]&&core(res)[0].k==='lfl'?'LFL':'yang aktif di kedua bulan'}</small></h2><div class="jam">${js.map((j,i)=>{const v=dj[i],h=Math.abs(v)/jm*46;return `<div title="${hh(j)}:00 · ${nB} ${fmt1(J.b[j])} → ${nA} ${fmt1(J.a[j])} item/gerai/hari (${v>=0?'+':''}${fmt1(v)})"><span class="z"></span><i style="${v>=0?`bottom:50%`:`top:50%`};height:${h}%;background:var(--${v>=0?'ok':'dn'})"></i><em>${j}</em></div>`}).join('')}</div><p class="note" style="margin-top:22px">Hijau = jam itu lebih ramai dari ${nB}, merah = lebih sepi. Dihitung per gerai per hari, jadi tidak terpengaruh jumlah hari atau gerai baru.</p></div>`}
  // ---- menu
  const ml=MN.l.filter(x=>x.d!==0);const mup=[...ml].sort((x,y)=>y.d-x.d).filter(x=>x.d>0).slice(0,Math.min(S.nrow,10)),mdn=[...ml].sort((x,y)=>x.d-y.d).filter(x=>x.d<0).slice(0,Math.min(S.nrow,10));
  const mt=(title,l)=>`<div class="card"><h2>${title}<small>Δ omzet${u}, menu master, ${MN.n} gerai pembanding</small></h2><div class="tw"><table><tr><th>Menu</th><th>Δ omzet</th><th>Δ qty</th><th>% qty</th><th class="tl">Catatan</th></tr>${l.length?l.map(x=>`<tr><td>${esc(x.n)}</td><td class="${cls(x.d)}"><b>${jtS(x.d)}</b></td><td class="${cls(x.qA-x.qB)}">${(x.qA-x.qB>=0?'+':'−')+fmt(Math.abs(x.qA-x.qB))}</td><td class="${cls(pct(x.qA,x.qB))}">${sgp(pct(x.qA,x.qB))}</td><td class="tl cause">${x.oB<=0?'menu baru di '+nA:x.oA<=0?'tidak terjual lagi di '+nA:''}</td></tr>`).join(''):'<tr><td colspan="5" class="tl cause">Tidak ada.</td></tr>'}</table></div></div>`;
  $('#main').innerHTML=`<div class="sum"><b class="h">Ringkasan otomatis</b><ul>${L.map(x=>`<li>${x}</li>`).join('')}</ul></div>${note}${kpis}
  <div class="g2"><div class="card"><h2>Jembatan omzet<small>dari mana perubahan datang</small></h2>${bridge}<p class="note">Omzet = transaksi × item per struk × harga per item. Tiga batang di atas dijumlahkan persis sama dengan selisih omzet.</p></div>
  <div class="card"><h2>Gerai: LFL vs baru / tutup<small>Δ omzet${u}</small></h2>${lflc}<p class="note">LFL = gerai yang buka ≥${FULL*100}% hari di kedua bulan. Buka sebagian = jumlah hari buka beda jauh (renovasi, libur, pause). Baru = belum ada penjualan sebelum ${nA}.</p></div></div>
  ${kacT}${chT}
  <div class="filters" style="padding:0 0 8px;border:0"><label>Tampilkan gerai<select id="fn"><option value="10">10 teratas</option><option value="25">25 teratas</option><option value="50">50 teratas</option></select></label></div>
  ${gt('Gerai yang turun paling besar',dn)}${gt('Gerai yang naik paling besar',up)}
  ${jamC}<div class="g2">${mt('Menu yang naik',mup)}${mt('Menu yang turun',mdn)}</div>`;
  const fn=$('#fn');if(fn){fn.value=String(S.nrow);fn.onchange=e=>{S.nrow=+e.target.value;render()}}
}
function autoBasis(){if(S.basisUser||S.b<0)return;const nA=MO[S.a],nB=MO[S.b];
  S.basis=(DM[S.a]<dim(nA)||DM[S.b]<dim(nB)||dim(nA)!==dim(nB))?'hari':'total';$('#fm').value=S.basis}
function setPair(a,b){S.a=a;S.b=b;$('#fa').value=a;$('#fb').value=b;presets();autoBasis()}
function presets(){const nA=MO[S.a];$('#pl').disabled=!MI.has(shift(nA,-1,0));$('#py').disabled=!MI.has(shift(nA,0,-1))}
function defB(a){const p=MI.get(shift(MO[a],-1,0));return p!=null?p:(a>0?a-1:-1)}
function fillToko(){
  const l=D.toko.map((t,i)=>[t,i]).filter(([t])=>(!S.wil||t.w===S.wil)&&(!S.kac||t.k===S.kac));
  $('#ft').innerHTML='<option value="">Semua toko</option>'+l.map(([t,i])=>`<option value="${i}">${esc(t.n)}</option>`).join('');$('#ft').value=S.toko;

function setup(){

  const mo=MO.map((m,i)=>`<option value="${i}">${m}</option>`).join('');$('#fa').innerHTML=mo;$('#fb').innerHTML=mo;
  $('#fw').innerHTML='<option value="">Semua wilayah</option>'+wilayahs.map(w=>`<option>${esc(w)}</option>`).join('');
  $('#fk').innerHTML='<option value="">Semua kacab</option>'+kacabs.map(k=>`<option>${esc(k)}</option>`).join('');
  fillToko();
  setPair(S.a,defB(S.a));
  $('#fa').onchange=e=>{const a=+e.target.value;let b=S.b;if(b<0||b>=a)b=defB(a);setPair(a,b);render()};
  $('#fb').onchange=e=>{let a=S.a,b=+e.target.value;if(b>=a){[a,b]=[b,a]}setPair(a,b);render()};
  $('#pl').onclick=()=>{const b=MI.get(shift(MO[S.a],-1,0));if(b!=null){setPair(S.a,b);render()}};
  $('#py').onclick=()=>{const b=MI.get(shift(MO[S.a],0,-1));if(b!=null){setPair(S.a,b);render()}};
  $('#fm').onchange=e=>{S.basis=e.target.value;S.basisUser=true;render()};

  $('#fk').onchange=e=>{S.kac=e.target.value;S.toko='';fillToko();render()};
  $('#ft').onchange=e=>{S.toko=e.target.value;render()};

}
function setTheme(t){document.documentElement.dataset.theme=t;$('#theme').textContent=t==='dark'?'☀ Terang':'☾ Gelap';try{localStorage.setItem('hisana_theme',t)}catch(e){}}
let T0='light';try{T0=localStorage.getItem('hisana_theme')||'light'}catch(e){}
const HP=()=>new URLSearchParams(location.hash.slice(1));
const EMB=HP().has('embed');
function fromHash(){
  const h=HP();const w=h.get('w')||'',k=h.get('k')||'',t=h.get('t')||'';
  S.wil=wilayahs.includes(w)?w:'';S.kac=kacabs.includes(k)?k:'';

function postH(){if(EMB&&window.parent!==window)parent.postMessage({nth:document.documentElement.scrollHeight},'*')}

if(location.protocol!=='file:')$('#back').style.display='inline-block';
window.addEventListener('message',e=>{if(e.data&&e.data.th&&EMB)setTheme(e.data.th)});

setup();
if(EMB){$('#fw').value=S.wil;$('#fk').value=S.kac;fillToko();render();
  window.addEventListener('hashchange',()=>{fromHash();$('#fw').value=S.wil;$('#fk').value=S.kac;fillToko();if(S.b<0||S.b>=S.a)S.b=defB(S.a);setPair(S.a,S.b);render()});

<script>
/* Urut kolom angka: klik judul kolom (tinggi->rendah, rendah->tinggi, urutan awal). Berlaku untuk semua tabel. */
(function(){
  const st=document.createElement('style');
  st.textContent='th.so{cursor:pointer;user-select:none;white-space:nowrap}th.so:hover{color:var(--act,#c2410c)}th.so::after{content:"\\2195";opacity:.35;margin-left:5px;font-size:11px}th.so.d::after{content:"\\25BC";opacity:1;color:var(--act,#c2410c)}th.so.a::after{content:"\\25B2";opacity:1;color:var(--act,#c2410c)}';
  document.head.appendChild(st);
  const MEM={};
  function num(t){
    t=(t||'').replace(/−/g,'-').trim();if(!t)return null;
    const m=t.match(/^(?:Rp\s*|[^\d\-+A-Za-z]{0,3}\s*)?([+\-]?\d[\d.,]*)(.*)$/);if(!m)return null;
    if(/^\d{4}-\d{2}/.test(t)||m[2].length>14)return null;
    let s=m[1].replace(/^\+/,''),neg=s[0]==='-';s=s.replace(/^-/,'');
    if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
    let v=parseFloat(s);if(isNaN(v))return null;if(neg)v=-v;
    const r=m[2];
    if(/^\s*M\b/.test(r))v*=1e9;else if(/^\s*jt\b/.test(r))v*=1e6;else if(/^Rp/.test(t))v*=1;
    return v;
  }
  function key(i){let t='';try{t=(typeof S!=='undefined'&&S.tab)||''}catch(e){}return t+'#'+i}
  function apply(tb,col,dir){
    const rows=tb._body,cn=tb._n;
    const ok=rows.filter(r=>r.cells.length===cn);
    const bad=rows.filter(r=>r.cells.length!==cn);
    let ord;
    if(!dir)ord=ok.slice().sort((a,b)=>a._o-b._o);
    else{
      const val=new Map(ok.map(r=>[r,num(r.cells[col].innerText)]));
      ord=ok.slice().sort((a,b)=>{const x=val.get(a),y=val.get(b);
        if(x==null&&y==null)return a._o-b._o;if(x==null)return 1;if(y==null)return -1;
        return (dir==='d'?y-x:x-y)||(a._o-b._o)});
    }
    const par=ok.length?ok[0].parentNode:null;if(!par)return;
    ord.concat(bad).forEach(r=>par.appendChild(r));
    tb._hd.forEach((th,i)=>{th.classList.remove('d','a');if(i===col&&dir)th.classList.add(dir)});
  }
  function init(){
    [...document.querySelectorAll('table')].forEach((tb,ti)=>{
      if(tb.dataset.so)return;tb.dataset.so='1';
      const all=[...tb.rows];let h=0;while(h<all.length&&[...all[h].cells].every(c=>c.tagName==='TH'))h++;
      if(!h)return;const hr=all[h-1],body=all.slice(h);
      if(body.length<2||body.some(r=>[...r.cells].some(c=>c.tagName==='TH')))return;
      const cn=hr.cells.length;if(hr.cells.length!==[...hr.cells].reduce((a,c)=>a+c.colSpan,0))return;
      body.forEach((r,i)=>r._o=i);
      tb._body=body;tb._n=cn;tb._hd=[...hr.cells];
      tb._hd.forEach((th,ci)=>{
        if(ci===0)return;
        const vals=body.filter(r=>r.cells.length===cn).map(r=>num(r.cells[ci].innerText));
        const nn=vals.filter(v=>v!=null).length;if(!vals.length||nn/vals.length<.6)return;
        th.classList.add('so');th.title='Klik untuk mengurutkan';
        th.addEventListener('click',()=>{
          const k=key(ti),cur=MEM[k];let dir='d';
          if(cur&&cur.col===ci)dir=cur.dir==='d'?'a':cur.dir==='a'?'':'d';
          MEM[k]={col:ci,dir};apply(tb,ci,dir);
        });
      });
      const m=MEM[key(ti)];if(m&&m.dir&&tb._hd[m.col]&&tb._hd[m.col].classList.contains('so'))apply(tb,m.col,m.dir);
    });
  }
  let q=0;const go=()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;try{init()}catch(e){}})};
  new MutationObserver(go).observe(document.body,{childList:true,subtree:true});
  go();
})();
</script>
