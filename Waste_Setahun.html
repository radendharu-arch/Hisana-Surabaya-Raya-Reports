  const body=l.map(([bi,a])=>{const mx=Math.max(...a.m.slice(S.b0,S.b1+1));const u=use.get(bi)||0;const pct=u+a.pw>0?a.pw/(u+a.pw):null;
    let cells='';for(let b=S.b0;b<=S.b1;b++)cells+=`<td style="${heat(a.m[b],mx)}">${a.m[b]?fmt1(a.m[b]):''}</td>`;
    return `<tr class="br" data-b="${bi}"><td>${esc(D.barang[bi])}</td>${cells}<td><b>${fmt1(a.tot)}</b></td><td>${fmt1(a.tot/nb)}</td><td>${a.tk.size}</td><td>${pct==null?'–':pc(pct)}</td></tr>`}).join('');
  return `<div class="kpis">
   <div class="kpi"><b>${l.length}</b><span>Barang ber-waste</span></div>
   <div class="kpi"><b class="sm">${esc(D.barang[top[0]])}</b><span>Waste terbesar (${fmt1(top[1].tot)})</span></div>
   <div class="kpi"><b>${tk.size}</b><span>Gerai/kelompok yang mencatat waste</span></div>
   <div class="kpi"><b>${nb}</b><span>Bulan dalam rentang</span></div></div>
  <div class="card"><h2>Waste per barang per bulan</h2><div class="tw"><table><tr><th>Barang</th>${hd}<th>Total</th><th>Rata² / bulan</th><th>Gerai</th><th>% dari pakai</th></tr>${body}</table></div>
  <p class="note">Klik barang untuk rincian per bulan, kacab, dan gerai. Satuan tiap barang beda (pcs, gram, dll), jadi angka antar barang tidak dijumlahkan. "% dari pakai" = waste ÷ (pemakaian dari penjualan × resep + waste); waste dari file gabungan beberapa toko tidak ikut persentase.</p></div>`;
}

function detail(W,P){
  const b=+S.br;const nb=S.b1-S.b0+1;const w=W.filter(r=>r[2]===b),p=P.filter(r=>r[2]===b);
  const wm=new Array(M).fill(0),pm=new Array(M).fill(0),wmn=new Array(M).fill(0);
  w.forEach(r=>{wm[r[0]]+=r[3];if(!D.toko[r[1]].g)wmn[r[0]]+=r[3]});p.forEach(r=>pm[r[0]]+=r[3]);
  const tot=wm.reduce((a,v)=>a+v,0),totn=wmn.reduce((a,v)=>a+v,0),pu=pm.reduce((a,v)=>a+v,0);
  const rate=pu+totn>0?totn/(pu+totn):null;
  const tk=new Set(w.map(r=>r[1]));
  // bar per bulan
  const mx=Math.max(...wm.slice(S.b0,S.b1+1))||1;
  let bars='<div class="jam">';for(let i=S.b0;i<=S.b1;i++){const pr=pm[i]+wmn[i]>0?wmn[i]/(pm[i]+wmn[i]):null;bars+=`<div title="${MO[i]} · waste ${fmt1(wm[i])}${pr==null?'':' · '+pc(pr)+' dari pakai'}"><span>${wm[i]?fmt1(wm[i]):''}</span><i style="height:${wm[i]/mx*115}px"></i><span>${MO[i].slice(2)}</span><span>${pr==null?'':pc(pr)}</span></div>`}bars+='</div>';
  // per toko / per kacab
  const tw=new Map(),tp=new Map(),tm=new Map();
  w.forEach(r=>{tw.set(r[1],(tw.get(r[1])||0)+r[3]);(tm.get(r[1])||tm.set(r[1],new Set()).get(r[1])).add(r[0])});
  p.forEach(r=>tp.set(r[1],(tp.get(r[1])||0)+r[3]));
  const rows=[...tw].map(([ti,q])=>{const t=D.toko[ti];const u=tp.get(ti)||0;const ok=!t.g&&u+q>0;return {ti,n:t.n,k:t.k||'(tanpa kacab)',q,u,r:ok?q/(u+q):null,nm:tm.get(ti).size}});
  const kk=new Map();rows.forEach(x=>{let a=kk.get(x.k);if(!a){a={q:0,u:0,n:0,qn:0};kk.set(x.k,a)}a.q+=x.q;a.n++;if(x.r!=null){a.qn+=x.q;a.u+=x.u}});
  const krows=[...kk].map(([k,a])=>[k,a.q,a.n,a.u+a.qn>0?a.qn/(a.u+a.qn):null]).sort((x,y)=>y[1]-x[1]);
  const ttl=rows.sort((x,y)=>y.q-x.q);const lim=40;
  const cls=r=>r!=null&&rate!=null&&r>rate*1.5?'hi':(r!=null&&rate!=null&&r<rate*0.5?'lo':'');
  const nbl=S.b1-S.b0+1;
  return `<div class="kpis">
   <div class="kpi"><b>${fmt1(tot)}</b><span>Total waste ${esc(D.barang[b])}</span></div>
   <div class="kpi"><b>${rate==null?'–':pc(rate)}</b><span>% dari pakai</span></div>
   <div class="kpi"><b>${fmt1(tot/nbl)}</b><span>Rata² waste / bulan</span></div>
   <div class="kpi"><b>${tk.size}</b><span>Gerai yang mencatat waste</span></div></div>
  <div class="card"><h2>Waste ${esc(D.barang[b])} per bulan</h2>${bars}<p class="note">Angka di atas batang = qty waste, di bawah = % dari pakai.</p></div>
  <div class="card"><h2>Per kacab</h2><div class="tw"><table><tr><th>Kacab</th><th>Waste</th><th>Gerai</th><th>% dari pakai</th></tr>${krows.map(([k,q,n,r])=>`<tr><td>${esc(k)}</td><td>${fmt1(q)}</td><td>${n}</td><td class="${cls(r)}">${r==null?'–':pc(r)}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>Per gerai${ttl.length>lim?` (${lim} teratas dari ${ttl.length})`:''}</h2><div class="tw"><table><tr><th>Gerai</th><th>Kacab</th><th>Waste</th><th>Pakai</th><th>% dari pakai</th><th>Bulan ada waste</th></tr>${ttl.slice(0,lim).map(x=>`<tr><td>${esc(x.n)}</td><td style="text-align:left">${esc(x.k)}</td><td>${fmt1(x.q)}</td><td>${fmt1(x.u)}</td><td class="${cls(x.r)}">${x.r==null?'–':pc(x.r)}</td><td>${x.nm} dari ${nbl}</td></tr>`).join('')}</table></div>
  <p class="note">Merah = persentase waste lebih dari 1,5× rata-rata semua gerai terpilih; hijau = kurang dari setengahnya. Gerai dengan waste sedikit tapi pakai besar bisa saja bagus; gerai tanpa catatan waste tidak tampil di sini.</p></div>
  <div class="card"><h2>Rincian per bulan</h2><div class="tw"><table><tr><th>Bulan</th><th>Waste</th><th>Pakai</th><th>% dari pakai</th></tr>${MO.map((m,i)=>i<S.b0||i>S.b1?'':`<tr><td>${m}</td><td>${wm[i]?fmt1(wm[i]):'–'}</td><td>${fmt1(pm[i])}</td><td>${pm[i]+wmn[i]>0?pc(wmn[i]/(pm[i]+wmn[i])):'–'}</td></tr>`).join('')}</table></div></div>`;
}

function render(){try{render0()}finally{postH()}}
function render0(){
  if(S.b0>S.b1||S.b0>=M||S.b1<0){$('#main').innerHTML='<div class="card"><p class="note">Tidak ada data pada rentang bulan ini.</p></div>';return}
  const {W,P}=sel();
  if(!D.w.length){$('#main').innerHTML='<div class="card"><p class="note">Belum ada data waste. Waste terbaca dari sheet stok di file POS (export per gerai per hari supaya terpisah per gerai) atau dari sheet Waste di INPUT_MANUAL.xlsx.</p></div>';return}
  if(!W.length){$('#main').innerHTML='<div class="card"><p class="note">Tidak ada waste untuk filter ini.</p></div>';return}
  $('#main').innerHTML=S.br===''?overview(W,P):detail(W,P);
  document.querySelectorAll('tr.br').forEach(tr=>tr.onclick=()=>{S.br=tr.dataset.b;$('#fr').value=S.br;render();window.scrollTo(0,0)});
}
function fillToko(){
  const l=D.toko.map((t,i)=>[t,i]).filter(([t])=>!t.g&&t.w&&(!S.wil||t.w===S.wil)&&(!S.kac||t.k===S.kac));
  $('#ft').innerHTML='<option value="">Semua toko</option>'+l.map(([t,i])=>`<option value="${i}">${esc(t.n)}</option>`).join('');$('#ft').value=S.toko;
}
function fillBarang(){
  const tot=new Map();D.w.forEach(r=>{if(inM(r)&&okT(r[1]))tot.set(r[2],(tot.get(r[2])||0)+r[3])});
  const l=[...tot].sort((a,b)=>b[1]-a[1]);
  $('#fr').innerHTML='<option value="">Semua barang (ringkasan)</option>'+l.map(([i])=>`<option value="${i}">${esc(D.barang[i])}</option>`).join('');
  if(S.br!==''&&!tot.has(+S.br))S.br='';
  $('#fr').value=S.br;
}
function setup(){
  $('#sub').textContent=`${MO[0]} s/d ${MO[M-1]} · dibuat ${D.meta.generated}`;
  const mo=MO.map((m,i)=>`<option value="${i}">${m}</option>`).join('');$('#fb0').innerHTML=mo;$('#fb1').innerHTML=mo;$('#fb0').value=S.b0;$('#fb1').value=S.b1;
  $('#fw').innerHTML='<option value="">Semua wilayah</option>'+wilayahs.map(w=>`<option>${esc(w)}</option>`).join('');
  $('#fk').innerHTML='<option value="">Semua kacab</option>'+kacabs.map(k=>`<option>${esc(k)}</option>`).join('');
  fillToko();fillBarang();
  const re=()=>{fillBarang();render()};
  $('#fb0').onchange=e=>{S.b0=+e.target.value;if(S.b0>S.b1){S.b1=S.b0;$('#fb1').value=S.b1}re()};
  $('#fb1').onchange=e=>{S.b1=+e.target.value;if(S.b1<S.b0){S.b0=S.b1;$('#fb0').value=S.b0}re()};
  $('#fw').onchange=e=>{S.wil=e.target.value;S.toko='';fillToko();re()};
  $('#fk').onchange=e=>{S.kac=e.target.value;S.toko='';fillToko();re()};
  $('#ft').onchange=e=>{S.toko=e.target.value;re()};
  $('#fr').onchange=e=>{S.br=e.target.value;render()};
  render();
}
function setTheme(t){document.documentElement.dataset.theme=t;$('#theme').textContent=t==='dark'?'☀ Terang':'☾ Gelap';try{localStorage.setItem('hisana_theme',t)}catch(e){}}
let T0='light';try{T0=localStorage.getItem('hisana_theme')||'light'}catch(e){}
const HP=()=>new URLSearchParams(location.hash.slice(1));
const EMB=HP().has('embed');
function applyRange(h){const f=h.get('f'),u=h.get('u');if(!f&&!u)return;document.body.classList.add('emb-p');
  let b0=MO.findIndex(m=>m>=(f||''));if(b0<0)b0=M;let b1=-1;for(let i=0;i<M;i++)if(MO[i]<=(u||'9999-99'))b1=i;S.b0=b0;S.b1=b1}
function fromHash(){const h=HP();applyRange(h);const w=h.get('w')||'',k=h.get('k')||'',t=h.get('t')||'';
  S.wil=wilayahs.includes(w)?w:'';S.kac=kacabs.includes(k)?k:'';const ix=D.toko.findIndex(x=>x.n===t&&!x.g);S.toko=ix>=0?String(ix):'';if(h.get('th'))setTheme(h.get('th'))}
function postH(){if(EMB&&window.parent!==window)parent.postMessage({wsh:document.documentElement.scrollHeight},'*')}
setTheme(T0);$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
if(location.protocol!=='file:')$('#back').style.display='inline-block';
window.addEventListener('message',e=>{if(e.data&&e.data.th&&EMB)setTheme(e.data.th)});
if(EMB){document.body.classList.add('emb');fromHash()}
setup();
if(EMB){const sync=()=>{$('#fw').value=S.wil;$('#fk').value=S.kac;fillToko();fillBarang();render()};sync();
  window.addEventListener('hashchange',()=>{fromHash();sync()});window.addEventListener('resize',postH)}
</script>
<script>
/* Urut kolom angka: klik judul kolom (tinggi->rendah, rendah->tinggi, urutan awal). Berlaku untuk semua tabel. */
(function(){
  const st=document.createElement('style');
  st.textContent='th.so{cursor:pointer;user-select:none;white-space:nowrap}th.so:hover{color:var(--act,#c2410c)}th.so::after{content:"\\2195";opacity:.35;margin-left:5px;font-size:11px}th.so.d::after{content:"\\25BC";opacity:1;color:var(--act,#c2410c)}th.so.a::after{content:"\\25B2";opacity:1;color:var(--act,#c2410c)}';
  document.head.appendChild(st);
  const MEM={};
  function num(t){
    t=(t||'').replace(/−/g,'-').trim();if(!t)return null;
    const m=t.match(/^(?:Rp\s*|[^\d\-+A-Za-z]{0,3}\s*)?([+\-]?\d[\d.,]*)(.*)$/);if(!m)return null;
    if(/^\d{4}-\d{2}/.test(t)||m[2].length>14)return null;
    let s=m[1].replace(/^\+/,''),neg=s[0]==='-';s=s.replace(/^-/,'');
    if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
    let v=parseFloat(s);if(isNaN(v))return null;if(neg)v=-v;
    const r=m[2];
    if(/^\s*M\b/.test(r))v*=1e9;else if(/^\s*jt\b/.test(r))v*=1e6;else if(/^Rp/.test(t))v*=1;
    return v;
  }
  function key(i){let t='';try{t=(typeof S!=='undefined'&&S.tab)||''}catch(e){}return t+'#'+i}
  function apply(tb,col,dir){
    const rows=tb._body,cn=tb._n;
    const ok=rows.filter(r=>r.cells.length===cn);
    const bad=rows.filter(r=>r.cells.length!==cn);
    let ord;
    if(!dir)ord=ok.slice().sort((a,b)=>a._o-b._o);
    else{
      const val=new Map(ok.map(r=>[r,num(r.cells[col].innerText)]));
      ord=ok.slice().sort((a,b)=>{const x=val.get(a),y=val.get(b);
        if(x==null&&y==null)return a._o-b._o;if(x==null)return 1;if(y==null)return -1;
        return (dir==='d'?y-x:x-y)||(a._o-b._o)});
    }
    const par=ok.length?ok[0].parentNode:null;if(!par)return;
    ord.concat(bad).forEach(r=>par.appendChild(r));
    tb._hd.forEach((th,i)=>{th.classList.remove('d','a');if(i===col&&dir)th.classList.add(dir)});
  }
  function init(){
    [...document.querySelectorAll('table')].forEach((tb,ti)=>{
      if(tb.dataset.so)return;tb.dataset.so='1';
      const all=[...tb.rows];let h=0;while(h<all.length&&[...all[h].cells].every(c=>c.tagName==='TH'))h++;
      if(!h)return;const hr=all[h-1],body=all.slice(h);
      if(body.length<2||body.some(r=>[...r.cells].some(c=>c.tagName==='TH')))return;
      const cn=hr.cells.length;if(hr.cells.length!==[...hr.cells].reduce((a,c)=>a+c.colSpan,0))return;
      body.forEach((r,i)=>r._o=i);
      tb._body=body;tb._n=cn;tb._hd=[...hr.cells];
      tb._hd.forEach((th,ci)=>{
        if(ci===0)return;
        const vals=body.filter(r=>r.cells.length===cn).map(r=>num(r.cells[ci].innerText));
        const nn=vals.filter(v=>v!=null).length;if(!vals.length||nn/vals.length<.6)return;
        th.classList.add('so');th.title='Klik untuk mengurutkan';
        th.addEventListener('click',()=>{
          const k=key(ti),cur=MEM[k];let dir='d';
          if(cur&&cur.col===ci)dir=cur.dir==='d'?'a':cur.dir==='a'?'':'d';
          MEM[k]={col:ci,dir};apply(tb,ci,dir);
        });
      });
      const m=MEM[key(ti)];if(m&&m.dir&&tb._hd[m.col]&&tb._hd[m.col].classList.contains('so'))apply(tb,m.col,m.dir);
    });
  }
  let q=0;const go=()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;try{init()}catch(e){}})};
  new MutationObserver(go).observe(document.body,{childList:true,subtree:true});
  go();
})();
</script>
