    return `<tr><td>${i+1}</td><td class="l nm">${esc(x.n)}<span class="sub2">${S.basis==='mt'?'setara: ':''}${var2}</span></td><td class="l">${chn}</td>${last}<td style="background:linear-gradient(90deg,var(--ac2) ${(a.q/mx*100).toFixed(0)}%,transparent 0)">${fmt(a.q)}</td><td>${totQ?(a.q/totQ*100).toFixed(1):'–'}%</td><td>${rp(a.o)}</td><td>${a.q?rp(a.o/a.q):'–'}</td><td>${a.tk.size}</td><td>${spark(a,tdm)}</td><td>${chg}</td><td><span class="bd ${s.c}" title="${esc(s.tip||'')}">${s.t}</span></td></tr>`}).join('');
  const nb=S.b1-S.b0+1;
  $('#main').innerHTML=`<div class="kpis">
   <div class="kpi"><b>${act.length}</b><span>${lab} terjual (dari ${all.length} yang pernah ada)</span></div>
   <div class="kpi"><b>${fmt(totQ)}</b><span>Total qty · ${nb} bulan · ${rp(totO)}</span></div>
   <div class="kpi"><b>${totQ?(top10/totQ*100).toFixed(0):'–'}%</b><span>Qty dari 10 menu teratas (konsentrasi)</span></div>
   <div class="kpi"><b>${berhenti.length} berhenti · ${baru.length} baru</b><span>Menu berhenti terjual / baru muncul di data</span></div></div>
  <div class="chips">${chip('top','Terlaris')}${chip('low','Paling sedikit')}${chip('stop','Berhenti terjual',berhenti.length)}${chip('up','Naik',act.filter(x=>x.s.t==='Naik').length)}${chip('down','Turun',act.filter(x=>x.s.t==='Turun').length)}${chip('new','Baru',baru.length)}</div>
  <div class="card"><h2>${{top:'Menu terlaris',low:'Menu paling sedikit terjual',stop:'Menu yang berhenti terjual (ada sebelumnya, nol di bulan terbaru)',up:'Menu yang naik',down:'Menu yang turun',new:'Menu baru'}[S.view]} · ${l.length} ${lab.toLowerCase()}${q?` (cocok "${esc(S.q)}")`:''}</h2>
  ${l.length?`<div class="tw"><table><tr><th>#</th><th class="l">${lab}</th><th class="l">Channel</th>${S.view==='stop'?'<th>Terakhir terjual</th>':''}<th>Qty</th><th>% qty</th><th>Omzet</th><th>Harga rata²</th><th>Gerai</th><th>Tren</th><th>Perubahan</th><th>Status</th></tr>${rows}</table></div>${l.length>S.lim?`<button class="btn" id="more">Tampilkan ${Math.min(100,l.length-S.lim)} lagi (${S.lim} dari ${l.length})</button>`:''}`:'<p class="note">Tidak ada data untuk pilihan ini.</p>'}
  <p class="note">Qty dan omzet = total di rentang bulan terpilih. <b>Tren</b> dan <b>Perubahan</b> memakai penjualan per hari-gerai, jadi bulan yang belum penuh tidak langsung terlihat turun: Naik/Turun = bulan terakhir di rentang dibanding bulan sebelumnya (minimal 20 terjual di bulan pembanding, selisih 25% atau lebih). <b>Berhenti</b> = pernah terjual tapi nol di bulan terbaru data (${MO[M-1]}); <b>Baru</b> = baru muncul di 2 bulan terakhir data. Menu yang tidak pernah terjual tidak ada di data POS, jadi tidak tampil.</p></div>`;
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.lim=100;render()});
  const mo=$('#more');if(mo)mo.onclick=()=>{S.lim+=100;render()};
}
function fillToko(){
  const l=D.toko.map((t,i)=>[t,i]).filter(([t])=>(!S.wil||t.w===S.wil)&&(!S.kac||t.k===S.kac));
  $('#ft').innerHTML='<option value="">Semua toko</option>'+l.map(([t,i])=>`<option value="${i}">${esc(t.n)}</option>`).join('');$('#ft').value=S.toko;
}
function setup(){
  $('#sub').textContent=`${MO[0]} s/d ${MO[M-1]} · dibuat ${D.meta.generated}`;
  const mo=MO.map((m,i)=>`<option value="${i}">${m}</option>`).join('');$('#fb0').innerHTML=mo;$('#fb1').innerHTML=mo;$('#fb0').value=S.b0;$('#fb1').value=S.b1;
  $('#fw').innerHTML='<option value="">Semua wilayah</option>'+wilayahs.map(w=>`<option>${esc(w)}</option>`).join('');
  $('#fk').innerHTML='<option value="">Semua kacab</option>'+kacabs.map(k=>`<option>${esc(k)}</option>`).join('');
  $('#fc').innerHTML='<option value="">Semua channel</option><option value="off">Offline saja</option><option value="on">Online (semua)</option>'+D.chan.map((c,i)=>i?`<option value="${i}">${esc(c)}</option>`:'').join('');
  fillToko();
  const re=()=>{S.lim=100;render()};
  $('#fb0').onchange=e=>{S.b0=+e.target.value;if(S.b0>S.b1){S.b1=S.b0;$('#fb1').value=S.b1}re()};
  $('#fb1').onchange=e=>{S.b1=+e.target.value;if(S.b1<S.b0){S.b0=S.b1;$('#fb0').value=S.b0}re()};
  $('#fw').onchange=e=>{S.wil=e.target.value;S.toko='';fillToko();re()};
  $('#fk').onchange=e=>{S.kac=e.target.value;S.toko='';fillToko();re()};
  $('#ft').onchange=e=>{S.toko=e.target.value;re()};
  $('#fc').onchange=e=>{S.ch=e.target.value;re()};
  $('#fd').onchange=e=>{S.basis=e.target.value;re()};
  $('#fq').oninput=e=>{S.q=e.target.value;re()};
  render();
}
function setTheme(t){document.documentElement.dataset.theme=t;$('#theme').textContent=t==='dark'?'☀ Terang':'☾ Gelap';try{localStorage.setItem('hisana_theme',t)}catch(e){}}
let T0='light';try{T0=localStorage.getItem('hisana_theme')||'light'}catch(e){}
const HP=()=>new URLSearchParams(location.hash.slice(1));
const EMB=HP().has('embed');
function applyRange(h){const f=h.get('f'),u=h.get('u');if(!f&&!u)return;document.body.classList.add('emb-p');
  let b0=MO.findIndex(m=>m>=(f||''));if(b0<0)b0=M;let b1=-1;for(let i=0;i<M;i++)if(MO[i]<=(u||'9999-99'))b1=i;S.b0=b0;S.b1=b1}
function fromHash(){const h=HP();applyRange(h);const w=h.get('w')||'',k=h.get('k')||'',t=h.get('t')||'',c=h.get('c')||'';
  S.wil=wilayahs.includes(w)?w:'';S.kac=kacabs.includes(k)?k:'';S.ch=c;const ix=D.toko.findIndex(x=>x.n===t);S.toko=ix>=0?String(ix):'';if(h.get('th'))setTheme(h.get('th'))}
function postH(){if(EMB&&window.parent!==window)parent.postMessage({mth:document.documentElement.scrollHeight},'*')}
setTheme(T0);$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
if(location.protocol!=='file:')$('#back').style.display='inline-block';
window.addEventListener('message',e=>{if(e.data&&e.data.th&&EMB)setTheme(e.data.th)});
if(EMB){document.body.classList.add('emb');fromHash()}
setup();
if(EMB){const sync=()=>{$('#fw').value=S.wil;$('#fk').value=S.kac;$('#fc').value=S.ch;fillToko();render()};sync();
  window.addEventListener('hashchange',()=>{fromHash();sync()});window.addEventListener('resize',postH)}
</script>
<script>
/* Urut kolom angka: klik judul kolom (tinggi->rendah, rendah->tinggi, urutan awal). Berlaku untuk semua tabel. */
(function(){
  const st=document.createElement('style');
  st.textContent='th.so{cursor:pointer;user-select:none;white-space:nowrap}th.so:hover{color:var(--act,#c2410c)}th.so::after{content:"\\2195";opacity:.35;margin-left:5px;font-size:11px}th.so.d::after{content:"\\25BC";opacity:1;color:var(--act,#c2410c)}th.so.a::after{content:"\\25B2";opacity:1;color:var(--act,#c2410c)}';
  document.head.appendChild(st);
  const MEM={};
  function num(t){
    t=(t||'').replace(/−/g,'-').trim();if(!t)return null;
    const m=t.match(/^(?:Rp\s*|[^\d\-+A-Za-z]{0,3}\s*)?([+\-]?\d[\d.,]*)(.*)$/);if(!m)return null;
    if(/^\d{4}-\d{2}/.test(t)||m[2].length>14)return null;
    let s=m[1].replace(/^\+/,''),neg=s[0]==='-';s=s.replace(/^-/,'');
    if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
    let v=parseFloat(s);if(isNaN(v))return null;if(neg)v=-v;
    const r=m[2];
    if(/^\s*M\b/.test(r))v*=1e9;else if(/^\s*jt\b/.test(r))v*=1e6;else if(/^Rp/.test(t))v*=1;
    return v;
  }
  function key(i){let t='';try{t=(typeof S!=='undefined'&&S.tab)||''}catch(e){}return t+'#'+i}
  function apply(tb,col,dir){
    const rows=tb._body,cn=tb._n;
    const ok=rows.filter(r=>r.cells.length===cn);
    const bad=rows.filter(r=>r.cells.length!==cn);
    let ord;
    if(!dir)ord=ok.slice().sort((a,b)=>a._o-b._o);
    else{
      const val=new Map(ok.map(r=>[r,num(r.cells[col].innerText)]));
      ord=ok.slice().sort((a,b)=>{const x=val.get(a),y=val.get(b);
        if(x==null&&y==null)return a._o-b._o;if(x==null)return 1;if(y==null)return -1;
        return (dir==='d'?y-x:x-y)||(a._o-b._o)});
    }
    const par=ok.length?ok[0].parentNode:null;if(!par)return;
    ord.concat(bad).forEach(r=>par.appendChild(r));
    tb._hd.forEach((th,i)=>{th.classList.remove('d','a');if(i===col&&dir)th.classList.add(dir)});
  }
  function init(){
    [...document.querySelectorAll('table')].forEach((tb,ti)=>{
      if(tb.dataset.so)return;tb.dataset.so='1';
      const all=[...tb.rows];let h=0;while(h<all.length&&[...all[h].cells].every(c=>c.tagName==='TH'))h++;
      if(!h)return;const hr=all[h-1],body=all.slice(h);
      if(body.length<2||body.some(r=>[...r.cells].some(c=>c.tagName==='TH')))return;
      const cn=hr.cells.length;if(hr.cells.length!==[...hr.cells].reduce((a,c)=>a+c.colSpan,0))return;
      body.forEach((r,i)=>r._o=i);
      tb._body=body;tb._n=cn;tb._hd=[...hr.cells];
      tb._hd.forEach((th,ci)=>{
        if(ci===0)return;
        const vals=body.filter(r=>r.cells.length===cn).map(r=>num(r.cells[ci].innerText));
        const nn=vals.filter(v=>v!=null).length;if(!vals.length||nn/vals.length<.6)return;
        th.classList.add('so');th.title='Klik untuk mengurutkan';
        th.addEventListener('click',()=>{
          const k=key(ti),cur=MEM[k];let dir='d';
          if(cur&&cur.col===ci)dir=cur.dir==='d'?'a':cur.dir==='a'?'':'d';
          MEM[k]={col:ci,dir};apply(tb,ci,dir);
        });
      });
      const m=MEM[key(ti)];if(m&&m.dir&&tb._hd[m.col]&&tb._hd[m.col].classList.contains('so'))apply(tb,m.col,m.dir);
    });
  }
  let q=0;const go=()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;try{init()}catch(e){}})};
  new MutationObserver(go).observe(document.body,{childList:true,subtree:true});
  go();
})();
</script>
