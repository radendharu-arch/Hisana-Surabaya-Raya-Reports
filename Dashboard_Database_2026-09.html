const fmt=n=>(n==null||isNaN(n))?'–':Math.round(n).toLocaleString('id-ID');

function okT(ti){const t=D.toko[ti];if(S.toko!=='')return ti===+S.toko;if(S.wil&&t.w!==S.wil)return false;if(S.kac&&t.k!==S.kac)return false;return true}
function okD(di){const d=D.tgl[di];return d>=S.from&&d<=S.to}
const PI=D.toko.map(t=>t.p?D.toko.findIndex(x=>x.n===t.p):-1);
function pool(ti){let x=ti,n=0;while(PI[x]>=0&&n++<3)x=PI[x];return x}
function okTP(ti){if(S.toko!=='')return pool(ti)===pool(+S.toko);return okT(ti)}
function rowsP(arr,ti=0,di=1){return arr.filter(r=>okTP(r[ti])&&okD(r[di]))}
function okC(c){const v=S.ch;if(v==='')return true;if(v==='off')return c===0;if(v==='on')return c>0;return c===+v}
function rows(arr,ti=0,di=1,ci=-1){return arr.filter(r=>okT(r[ti])&&okD(r[di])&&(ci<0||okC(r[ci])))}
function ndays(){return new Set([...rows(D.jam).map(r=>r[1])]).size||1}

const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const mlabel=m=>MONF[+m.slice(5,7)-1]+' '+m.slice(0,4);
function dpText(){const a=S.from,b=S.to,ma=a.slice(0,7),mb=b.slice(0,7);
  if(a===D.meta.tmin&&b===D.meta.tmax)return 'Semua tanggal · '+(ma===mb?mlabel(ma):mlabel(ma)+' – '+mlabel(mb));
  const f=d=>(+d.slice(8))+' '+MON[+d.slice(5,7)-1];
  if(a===b)return f(a)+' '+a.slice(0,4);
  return ma===mb?(+a.slice(8))+'–'+(+b.slice(8))+' '+MON[+ma.slice(5,7)-1]+' '+ma.slice(0,4):f(a)+' – '+f(b)+' '+b.slice(0,4)}
function dpHTML(){
  const have=new Set(D.tgl);const ms=[...new Set(D.tgl.map(d=>d.slice(0,7)))];
  const q='<div class="dpq"><button type="button" data-q="all">Semua tanggal</button><button type="button" data-q="h1">Tgl 1–15</button><button type="button" data-q="h2">Tgl 16–akhir</button><button type="button" data-q="w">7 hari terakhir</button></div>';
  const cal=ms.map(m=>{const [y,mo]=m.split('-').map(Number);const off=(new Date(y,mo-1,1).getDay()+6)%7,n=new Date(y,mo,0).getDate();
    let c=`<div class="dpm"><b>${mlabel(m)}</b><div class="dpg">`+['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<i>${x}</i>`).join('')+'<span></span>'.repeat(off);
    for(let d=1;d<=n;d++){const ds=m+'-'+String(d).padStart(2,'0');const inr=ds>=S.from&&ds<=S.to;
      c+=`<button type="button" data-d="${ds}"${have.has(ds)?'':' disabled'} class="${inr?'in':''}${ds===S.from||ds===S.to?' ed':''}">${d}</button>`}
    return c+'</div></div>'}).join('');
  return q+cal+`<p class="note" style="margin:8px 0 0">${S.pend?'Sekarang klik tanggal akhir.':'Klik tanggal awal, lalu tanggal akhir. Tanggal yang abu-abu tidak ada datanya.'}</p>`}
function dpClose(){const o=$('#dpop');if(o.hidden)return;o.hidden=true;if(S.pend){S.pend=null;render()}}
function dpInit(){
  const b=$('#dpb'),o=$('#dpop');
  b.onclick=()=>{if(o.hidden){o.innerHTML=dpHTML();o.hidden=false}else dpClose()};
  o.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if(t.dataset.q){const T=D.tgl;let f=D.meta.tmin,u=D.meta.tmax;
      if(t.dataset.q==='h1'||t.dataset.q==='h2'){const l=T.filter(d=>t.dataset.q==='h1'?+d.slice(8)<=15:+d.slice(8)>=16);if(l.length){f=l[0];u=l[l.length-1]}}
      else if(t.dataset.q==='w')f=T[Math.max(0,T.length-7)];
      S.from=f;S.to=u;S.pend=null;o.hidden=true;render();return}
    const d=t.dataset.d;if(!d)return;
    if(!S.pend){S.pend=d;S.from=S.to=d;o.innerHTML=dpHTML();b.textContent=dpText()}
    else{const a=S.pend;S.from=a<d?a:d;S.to=a<d?d:a;S.pend=null;o.hidden=true;render()}};
  document.addEventListener('click',e=>{if(!e.composedPath().includes($('#dpw')))dpClose()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')dpClose()});
}

function syncCtl(){
  const cap=CAP[S.tab],em=EM(),bulan=em==='bulan';
  document.querySelectorAll('#pm button').forEach(b=>{b.classList.toggle('on',b.dataset.m===em);b.disabled=b.dataset.m==='rentang'&&!cap.r});
  $('#lm').style.display=bulan&&D.meta.cur&&D.meta.months.length>1?'':'none';
  $('#dpw').style.display=bulan?'':'none';$('#lr0').style.display=$('#lr1').style.display=bulan?'none':'';
  $('#fr0').value=S.r0;$('#fr1').value=S.r1;
  const db=$('#dpb');db.textContent=dpText();db.disabled=!cap.d;db.title=cap.d?'':'Tidak berlaku di tab ini';
  const fc=$('#fc');fc.disabled=!cap.c;fc.title=cap.c?'':'Tidak berlaku di tab ini';
  const nm=[];
  if(S.pm==='rentang'&&!cap.r)nm.push(`Tab ini dihitung per satu bulan (${mlabel(CURM)}), jadi rentang bulan tidak berlaku di sini.`);
  if(S.tab==='nt')nm.push(`Bulan utama: ${mlabel(bulan?CURM:BL[S.r1])}. Bulan pembanding dipilih di dalam halaman; filter tanggal dan channel tidak berlaku.`);
  else if(!cap.c)nm.push('Filter Channel tidak berlaku di tab ini.');
  const tn=$('#tabnote');tn.hidden=!nm.length;tn.textContent=nm.join(' ');
}

function recs(){

function grpTab(title,rs,keyF,labF,per,perL){
  const m=new Map();rs.forEach(r=>{const k=keyF(r);let a=m.get(k);if(!a){a={om:0,tk:new Set()};m.set(k,a)}a.om+=r.om;a.tk.add(r.t)});
  const tot=[...m.values()].reduce((x,a)=>x+a.om,0)||1;const l=[...m].sort((x,y)=>y[1].om-x[1].om);
  return `<div class="card"><h2>${title}</h2><div class="tw" style="max-height:340px"><table class="nw"><tr><th>${title.replace(/^Per /,'')}</th><th>Omzet</th><th>%</th><th>Gerai</th><th>Omzet / gerai / ${perL}</th></tr>${l.map(([k,a])=>`<tr><td>${esc(labF(k))}</td><td>${rpk(a.om)}</td><td>${(a.om/tot*100).toFixed(1)}%</td><td>${a.tk.size}</td><td>${rpk(a.om/a.tk.size/per)}</td></tr>`).join('')}</table></div></div>`;
}
function ringkas(){

    bars=`<div class="card"><h2>Omzet per hari (Rp juta)</h2><div class="jam">${kk.map(k=>{const v=m.get(k),d=D.tgl[k];return `<div title="${d} (${dw[new Date(d+'T00:00:00').getDay()]}) · ${rp(v)}"><span>${fmt1(v/1e6)}</span><i style="height:${v/mx*115}px"></i><span>${+d.slice(8)}</span></div>`}).join('')}</div></div>`}
  const grid=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:0 16px">${grpTab('Per channel',rs,r=>r.c,k=>D.chan[k],per,perL)}${grpTab('Per wilayah',rs,r=>D.toko[r.t].w||'-',k=>k,per,perL)}${grpTab('Per kacab',rs,r=>D.toko[r.t].k||'(tanpa kacab)',k=>k,per,perL)}</div>`;
  return head+kpis+bars+grid+trenBlock();
}
function jamLocal(){
  const j=rows(D.jam,0,1,6);const m=sumBy(j,2,[3,4,5]);const nd=ndays();
  const tot=[...m.values()].reduce((s,v)=>s+v[1],0)||1;
  const body=[...m].sort((a,b)=>a[0]-b[0]).map(([h,v])=>`<tr><td>${String(h).padStart(2,'0')}:00 – ${String(h).padStart(2,'0')}:59</td><td>${fmt(v[0])}</td><td>${fmt(v[1])}</td><td>${rp(v[2])}</td><td>${(v[1]/tot*100).toFixed(1)}%</td><td>${fmt1(v[1]/nd)}</td></tr>`).join('');
  // heatmap hari x jam
  const dn=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];const g={};let gm=0;const hs=new Set();
  const dd={};j.forEach(r=>{const dow=new Date(D.tgl[r[1]]+'T00:00:00').getDay();const k=dow+'_'+r[2];g[k]=(g[k]||0)+r[4];hs.add(r[2]);(dd[dow]=dd[dow]||new Set()).add(r[1])});
  Object.keys(g).forEach(k=>{g[k]=g[k]/dd[k.split('_')[0]].size});   // rata-rata per hari, supaya hari yang muncul 5x tidak lebih besar dari yang 4x
  Object.values(g).forEach(v=>gm=Math.max(gm,v));const H=[...hs].sort((a,b)=>a-b);
  let hmh='';if(H.length){hmh=`<div class="hm" style="grid-template-columns:60px repeat(${H.length},1fr)"><div></div>${H.map(h=>`<div>${h}</div>`).join('')}`;
    [1,2,3,4,5,6,0].forEach(d=>{const nd_=dd[d]?dd[d].size:0;hmh+=`<div style="text-align:left">${dn[d]} <small style="color:var(--mut)">×${nd_}</small></div>`+H.map(h=>{const v=g[d+'_'+h]||0;return `<div style="background:color-mix(in srgb,var(--ac) ${Math.round(v/gm*85)}%,transparent)" title="${dn[d]} ${h}:00 · rata-rata ${fmt1(v)} item per hari (dari ${nd_} hari)">${v?fmt(Math.round(v)):''}</div>`}).join('')});hmh+='</div>'}
  return `<div class="card"><h2>Item terjual per jam</h2>${jamChart()}</div>
  <div class="card"><h2>Rincian per jam</h2><div class="tw"><table><tr><th>Jam</th><th>Transaksi</th><th>Item</th><th>Omzet</th><th>% item</th><th>Item / hari</th></tr>${body}</table></div></div>
  <div class="card"><h2>Peta jam sibuk (hari × jam, rata-rata item per hari)</h2>${hmh||'<p class="note">Tidak ada data.</p>'}${hmh?'<p class="note">Angka = rata-rata item terjual per hari (semua toko yang dipilih). ×N = berapa hari itu ada datanya di rentang ini. Satu bulan cuma 4\u20135 contoh per hari, jadi puncak tunggal bisa karena kejadian sesaat (promo, libur, gajian).</p>':''}</div>`;
}
function trenBlock(){

      const pct=(a,b)=>b?`${a>=b?'+':''}${((a/b-1)*100).toFixed(1)}%`:'\u2013';

  const tm=new Map();rs.forEach(r=>{let a=tm.get(r[1]);if(!a){a=new Map();tm.set(r[1],a)}a.set(r[0],(a.get(r[0])||0)+r[5])});

  const useB=sumBy(rows(D.pakai,0,1),2,[3,4]);
  return `<div class="card"><h2>Waste per barang</h2>
  ${D.waste.some(r=>r[5]==='POS'&&D.toko[r[0]].n.includes(' + '))?'<p class="note">Sebagian waste POS berasal dari file gabungan beberapa toko (nama toko berisi "+"), jadi tidak bisa dipisah per toko. Export per toko per hari supaya terpisah.</p>':''}
  ${byB.length?`<div class="tw"><table><tr><th>Barang</th><th>Qty waste</th><th>% dari total pakai+waste</th></tr>${byB.map(([k,v])=>{const u=useB.get(k)||[0,0];const t=u[0]+u[1]+v[0];return `<tr><td>${esc(D.barang[k])}</td><td>${fmt(v[0])}</td><td>${t?(v[0]/t*100).toFixed(1)+'%':'–'}</td></tr>`}).join('')}</table></div>`:'<p class="note">Belum ada waste di rentang ini.</p>'}</div>
  <div class="card"><h2>Detail kejadian</h2><div class="tw"><table><tr><th>Tanggal</th><th>Toko</th><th>Barang</th><th>Qty</th><th>Alasan</th><th>Sumber</th></tr>${[...w].sort((a,b)=>D.tgl[b[1]].localeCompare(D.tgl[a[1]])).map(r=>`<tr><td>${D.tgl[r[1]]}</td><td>${esc(D.toko[r[0]].n)}</td><td>${esc(D.barang[r[2]])}</td><td>${fmt(r[3])}</td><td style="text-align:left">${esc(D.alasan[r[4]])}</td><td>${r[5]}</td></tr>`).join('')}</table></div></div>`;
}
function stokNote(){
  if(S.toko==='')return '';
  const t=+S.toko;const p=pool(t);const kids=D.toko.map((x,i)=>[x,i]).filter(([x,i])=>i!==p&&pool(i)===p).map(([x])=>x.n);
  if(p!==t)return `<div class="banner">${esc(D.toko[t].n)} adalah express dari <b>${esc(D.toko[p].n)}</b>. Stoknya ikut induk, jadi angka di bawah = gabungan induk + semua express-nya.</div>`;
  if(kids.length)return `<div class="banner">Pemakaian stok <b>${esc(D.toko[p].n)}</b> sudah digabung dengan express-nya: ${kids.map(esc).join(', ')}.</div>`;
  return '';
}
function stok(){
  const j=rowsP(D.jam);const nd=new Set(j.map(r=>r[1])).size||1;const nt=new Set(j.map(r=>pool(r[0]))).size||1;
  const use=new Map(),day=new Map();
  rowsP(D.pakai).forEach(r=>{let u=use.get(r[2]);if(!u){u=[0,0];use.set(r[2],u)}u[0]+=r[3];u[1]+=r[4];
    let d=day.get(r[2]);if(!d){d=new Map();day.set(r[2],d)}d.set(r[1],(d.get(r[1])||0)+r[3]+r[4])});
  const ws=sumBy(rowsP(D.waste),2,[3]);
  const names=new Set([...use.keys(),...ws.keys()]);
  const out=[...names].map(b=>{const u=use.get(b)||[0,0];const w=(ws.get(b)||[0])[0];
    const tot=u[0]+u[1]+w;const avg=tot/nd;const pt=avg/nt;
    const pk=day.get(b)?Math.max(...day.get(b).values()):0;
    return {b:D.barang[b],u0:u[0],u1:u[1],w,wp:tot?w/tot*100:0,tot,avg,pt,pk,rec:pt*(1+S.buf/100)}}).sort((a,b)=>b.tot-a.tot);
  return `<div class="card"><h2>Rekomendasi kebutuhan stok per barang</h2>
  ${stokNote()}<p class="note">Pemakaian = penjualan \u00d7 resep (paket + non-paket), ditambah waste. Periode ${nd} hari, ${nt} gerai/pool stok aktif (express dihitung ikut induknya).
  <b>Rata\u00b2/gerai/hari</b> = total \u00f7 hari \u00f7 gerai. <b>Rekomendasi</b> = rata\u00b2/gerai/hari + buffer <input id="th_buf" type="number" step="5" value="${S.buf}" style="width:60px">%.
  <b>Puncak</b> = hari dengan pemakaian tertinggi (semua gerai terfilter). Satuan mengikuti POS (saos BBQ dalam gram).</p>
  <div class="tw"><table><tr><th>Barang</th><th>Pakai paket</th><th>Pakai non-paket</th><th>Waste</th><th>% waste</th><th>Total</th><th>Rata\u00b2 / hari</th><th>Rata\u00b2 / gerai / hari</th><th>Puncak / hari</th><th>Rekomendasi / gerai / hari</th></tr>
  ${out.map(x=>`<tr><td>${esc(x.b)}</td><td>${fmt(x.u0)}</td><td>${fmt(x.u1)}</td><td>${fmt(x.w)}</td><td>${x.w?x.wp.toFixed(1)+'%':'\u2013'}</td><td>${fmt(x.tot)}</td><td>${fmt1(x.avg)}</td><td>${fmt1(x.pt)}</td><td>${fmt(x.pk)}</td><td><b>${fmt1(x.rec)}</b></td></tr>`).join('')}</table></div></div>`;
}
function cek(){
  const rec=D.recon.length?`<div class="tw"><table><tr><th>File</th><th>Barang</th><th>Paket (hitung)</th><th>Paket (POS)</th><th>Non-paket (hitung)</th><th>Non-paket (POS)</th></tr>${D.recon.map(r=>`<tr><td style="max-width:260px;word-break:break-all">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${fmt(r[2])}</td><td>${fmt(r[3])}</td><td>${fmt(r[4])}</td><td>${fmt(r[5])}</td></tr>`).join('')}</table></div>`:'<p class="note">Semua cocok.</p>';
  return `<div class="card"><h2>Rekonsiliasi resep vs sheet "Berdasarkan Stok Qty" dari POS</h2>
  <p class="note">${fmt(D.recon_ok)} baris barang cocok persis, ${D.recon.length} selisih. Selisih artinya resep otomatis belum sama dengan hitungan POS (atau POS mencatat dari sumber lain) → koreksi di sheet Resep INPUT_MANUAL.xlsx. Kelebihan di sisi POS tetap ikut dihitung sebagai pemakaian (gabungan toko) di tab Kebutuhan Stok.</p>${rec}
  ${D.unknown.length?`<p class="note"><b>Barang baru dari resep otomatis yang belum dikenal POS:</b> ${D.unknown.map(esc).join(', ')}</p>`:''}</div>
  <div class="card"><h2>Gerai express &amp; induknya (${D.induk.length})</h2>${D.tanpa_induk.length?`<p class="note"><b>Belum ada induknya:</b> ${D.tanpa_induk.map(esc).join(', ')}. Isi sheet <b>Induk</b> di INPUT_MANUAL.xlsx.</p>`:''}${D.induk.length?`<div class="tw"><table><tr><th>Express / stasiun</th><th>Induk</th></tr>${D.induk.map(r=>`<tr><td>${esc(r[0])}</td><td style="text-align:right">${esc(r[1])}</td></tr>`).join('')}</table></div>`:'<p class="note">Belum ada pemetaan express ke induk.</p>'}</div>
  <div class="card"><h2>Menu yang terdeteksi online</h2>${D.onlinemenus.length?`<div class="tw"><table><tr><th>Nama menu di POS</th><th>Channel</th><th>Qty</th></tr>${D.onlinemenus.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>${fmt(r[2])}</td></tr>`).join('')}</table></div>`:'<p class="note">Belum ada.</p>'}</div>
  <div class="card"><h2>Toko di database</h2><div class="tw"><table><tr><th>Toko</th><th>Wilayah</th><th>Baris</th><th>Dari</th><th>Sampai</th></tr>${D.tokoinfo.map(r=>`<tr><td>${esc(r[0])}${D.nokacab.includes(r[0])?' <span class="badge b-w">belum ada kacab</span>':''}</td><td style="text-align:right">${esc(r[1])}</td><td>${fmt(r[2])}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>Resep yang dipakai (${D.resep.length} menu)</h2><div class="tw"><table><tr><th>Menu</th><th>Bahan</th><th>Sumber</th></tr>${D.resep.map(r=>`<tr><td>${esc(r[0])}</td><td style="text-align:left">${esc(r[1])}</td><td>${r[2]}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>File yang sudah diimport</h2><div class="tw"><table><tr><th>File</th><th>Baris</th><th>Waktu import</th></tr>${D.files.map(r=>`<tr><td style="word-break:break-all">${esc(r[0])}</td><td>${fmt(r[1])}</td><td>${r[2]}</td></tr>`).join('')}</table></div></div>`;
}
function setTheme(t){document.documentElement.dataset.theme=t;$('#theme').textContent=t==='dark'?'\u2600 Terang':'\u263E Gelap';try{localStorage.setItem('hisana_theme',t)}catch(e){}
  ['#pjf','#wsf','#mtf','#ntf'].forEach(i=>{const f=$(i);if(f&&f.contentWindow)f.contentWindow.postMessage({th:t},'*')})}
let T0='light';try{T0=localStorage.getItem('hisana_theme')||'light'}catch(e){}
setTheme(T0);$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
if(location.protocol!=='file:')$('#back').style.display='inline-block';
setup();
</script>
</body>
</html>
